aid: prewave
name: Prewave
description: 'Prewave is a Vienna-based AI-powered supply-chain risk intelligence platform that
  monitors millions of risk events across languages and networks to give enterprises proactive
  resilience, multi-tier supplier transparency, and sustainability-compliance automation (EU
  Deforestation Regulation, LkSG, and CSDDD). The Public Prewave API is a REST API at
  api.prewave.com covering suppliers and sites, collections and the Tier-N supplier graph, alerts
  and the risk feed, disruptions, risk scores (target, external, and enterprise export), exposure
  graphs, EUDR products / origin requests / Due Diligence Statements, actions, and user and role
  management. It authenticates with an X-Auth-Token API key.'
