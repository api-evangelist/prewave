components:
  schemas:
    PublicTreeTargetV2:
      required:
      - edgeSource
      - suppliers
      - target
      - targetInfo
      type: object
      properties:
        target:
          type: integer
          description: The target id of the supplier
          format: int32
          example: null
        suppliers:
          type: array
          description: All sub-suppliers nested in the same structure
          items:
            $ref: '#/components/schemas/PublicTreeTargetV2'
          example: null
        targetInfo:
          $ref: '#/components/schemas/PublicTargetInfoDTO'
        edgeSource:
          type: string
          description: 'Allowed values "Public Media", "Public Customs", "Private", "Shared", "Prewave Prediction" '
          example: null
        edgeInfo:
          allOf:
          - $ref: '#/components/schemas/PublicEdgeInfo'
          example: null
        merged_targets:
          type: array
          description: Target ids of past targets that were merged into this current target
          items:
            type: integer
            description: Target ids of past targets that were merged into this current target
            format: int32
            example: null
          default: []
          example: null
      example: null
    TargetRequestTypeStatusDto:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int32
          example: null
        customerId:
          type:
