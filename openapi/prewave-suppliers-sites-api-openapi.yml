          type: string
        example: SAP
      responses:
        '200':
          description: Successfully found suppliers. Returns empty list if no matches found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSupplierDetailV2DTO'
