  /public/v2/suppliers/sites/identifiers:
    post:
      tags:
      - Suppliers - Sites
      summary: Create an identifier for a supplier
      description: 'Create a new identifier (supplier ID, customer ID, or own site ID) for a supplier using flexible search parameters.


        **Related Endpoints:**

        - To find suppliers by identifier, use `GET /public/v2/suppliers/sites/find-by-identifier`.

        - To delete an identifier, use `DELETE /public/v2/suppliers/sites/identifiers`.

        - To create a new supplier, use `POST /public/v2/suppliers/sites`.

        - To get all suppliers, use `GET /public/v2/suppliers/sites`.


        **How It Works:**


        1. **Find the Supplier**: Provide one or more search parameters to identify the supplier:

        - `supplierId` (optional): Search by supplier ID

        - `customerId` (optional): Search by customer ID

        - `ownId` (optional): Search by own site ID

        - `prewaveId` (optional): Search by Prewave ID

        - `source` (optional): Filter by source system (applies to supplierId, customerId, and ownId)


        2. **Create the Identifier**: In the request body, specify:

        - `type`: The type of identifier to create (`supplierId`, `customerId`, or `ownId`)

        - `id`: The identifier value

        - `source`: Optional source system (defaults to `PUBLIC_API` if not provided)


        **Search Parameters:**

        - `supplierId` (optional): Search by supplier ID

        - `customerId` (optional): Search by customer ID

        - `ownId` (optional): Search by own site ID

        - `prewaveId` (optional): Search by Prewave ID

        - `source` (optional): Filter by source system


        **Search Behavior:**

        - Parameters are combined with **OR** logic - suppliers matching ANY of the provided identifiers will be found

        - At least one search parameter must be provided

        - If multiple suppliers match, an error is returned (use `source` parameter to narrow down)

        - If no suppliers match, a 404 error is returned


        **Request Body:**

        The request body specifies what identifier to create:

        - `type`: Must be one of: `supplierId`, `customerId`, `ownId`

        - `id`: The identifier value (e.g., "SUP-12345")

        - `source`: Optional source system (e.g., "SAP", "Coupa")


        **Examples:**


        1. **Create a supplier ID by searching with prewaveId:**

        ```

        POST /public/v2/suppliers/sites/identifiers?prewaveId=102006215

        Body: {"type": "supplierId", "id": "SUP-12345", "source": "SAP"}

        ```


        2. **Create a customer ID by searching with existing supplier ID:**

        ```

        POST /public/v2/suppliers/sites/identifiers?supplierId=SUP-12345&source=SAP

        Body: {"type": "customerId", "id": "CUST-67890", "source": "SAP"}

        ```


        3. **Create an own site ID by searching with customer ID:**

        ```

        POST /public/v2/suppliers/sites/identifiers?customerId=CUST-67890

        Body: {"type": "ownId", "id": "OWN-SITE-01", "source": "SAP"}

        ```


        **Important Notes:**

        - The combination of identifier value and source must be unique within your organization

        - If the identifier already exists for this supplier, a 409 Conflict error is returned

        - If the identifier exists for a different supplier, a 409 Conflict error is returned

        - All identifier changes are automatically audited


        **Required Permission**: `MANAGE_PUBLIC_SUPPLIER_IDS`'
      operationId: createIdentifier
      parameters:
      - name: supplierId
        in: query
        description: Supplier ID to search for. Can be combined with customerId, ownId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: SAP-12345
      - name: customerId
        in: query
        description: Customer ID to search for. Can be combined with supplierId, ownId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: CRM-67890
      - name: ownId
        in: query
        description: Own site ID to search for. Can be combined with supplierId, customerId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: OWN-SITE-01
      - name: prewaveId
        in: query
        description: Prewave ID to search for. Can be combined with supplierId, customerId, and/or ownId.
        required: false
        schema:
          type: integer
          format: int32
        example: 12345
      - name: source
        in: query
        description: Optional source system to filter by. Applies to supplierId, customerId, and ownId (not prewaveId).
        required: false
        schema:
          type: string
        example: SAP
      requestBody:
        description: Identifier creation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicIdentifierCreatePayloadV2'
            examples:
              Create Supplier ID:
                summary: Create a supplier ID
                description: Create Supplier ID
                value:
                  type: supplierId
                  id: SUP-12345
                  source: SAP
              Create Customer ID:
                summary: Create a customer ID
                description: Create Customer ID
                value:
                  type: customerId
                  id: CUST-67890
                  source: SAP
              Create Own Site ID:
                summary: Create an own site ID
                description: Create Own Site ID
                value:
                  type: ownId
                  id: OWN-SITE-01
                  source: SAP
        required: true
      responses:
        '201':
          description: Created - Identifier created successfully.
          headers:
            Location:
              description: URI of the supplier that the identifier was added to
              required: true
              style: simple
              schema:
                type: string
                format: uri
              example: https://api.example.com/public/v2/suppliers/sites/101266998
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIdentifierResponseV2'
              examples:
                Success response:
                  summary: Successful identifier creation
                  description: Success response
                  value:
                    type: supplierId
                    id: SUP-12345
                    source: SAP
                    prewaveTargetId: 101266998
        '400':
          description: '400 Bad Request - Invalid request. This can occur if: (1) no search parameters provided, (2) invalid identifier type, (3) missing required fields in request body, or (4) multiple suppliers found (use source parameter to narrow down).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                No search parameters:
                  summary: No search parameters provided
                  description: No search parameters
                  value:
                    code: invalid_request
                    message: At least one ID parameter (supplierId, customerId, ownId, or prewaveId) must be provided
                    solution: Fix the request
                Invalid identifier type:
                  summary: Invalid identifier type
                  description: Invalid identifier type
                  value:
                    code: invalid_request
                    message: 'Invalid identifier type ''invalidType''. Must be one of: ''supplierId'', ''customerId'', ''ownId'''
                    solution: Fix the request
                Multiple suppliers found:
                  summary: Multiple suppliers match the search criteria
                  description: Multiple suppliers found
                  value:
                    code: invalid_request
                    message: 'Multiple suppliers found matching the provided identifiers. Found 2 suppliers with prewaveTargetIds: 102006215, 102006216. Please provide more specific identifiers or use the source parameter.'
                    solution: Fix the request
        '404':
          description: 404 Not Found - No supplier found matching the provided search parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Supplier not found:
                  summary: No supplier matches the search criteria
                  description: Supplier not found
                  value:
                    code: resource_not_found
