              examples:
                No ID parameters:
                  summary: No identifier provided
                  description: No ID parameters
                  value:
                    code: invalid_request
                    message: At least one ID parameter (supplierId, customerId, ownId, or prewaveId) must be provided
                    solution: Fix the request
                Multiple suppliers found:
                  summary: Search criteria matches multiple suppliers
                  description: Multiple suppliers found
                  value:
                    code: invalid_request
                    message: 'Multiple suppliers found matching the provided identifiers. Found 2 suppliers with prewaveTargetIds: 102006215, 102006216. Please provide more specific identifiers or use the source parameter.'
                    solution: Fix the request
        '404':
          description: 404 Not Found - No supplier found matching the provided identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Supplier not found:
                  summary: No supplier matches the identifiers
                  description: Supplier not found
                  value:
                    code: resource_not_found
                    message: No supplier found matching the provided identifiers
                    solution: Verify the identifiers and ensure the supplier exists in your organization
        '403':
