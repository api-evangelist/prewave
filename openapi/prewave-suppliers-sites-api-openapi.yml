                    linkedInId: acme-manufacturing
                    address: 123 Main St, Vienna, Austria
                    city: Vienna
                    countryCode: AT
                    postalCode: '1010'
                    website: https://www.acme-corp.com
                    description: Leading manufacturer of electronic components
                    logo: /images/company-img/acme-logo.jpg
                    yearFounded: 1999
                    size: Medium
                    supplierIds:
                    - id: SAP-12345
                      source: SAP
