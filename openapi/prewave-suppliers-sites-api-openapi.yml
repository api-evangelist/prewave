      summary: Request screening for a supplier
      description: "\nRequest a history screening for a supplier site. The body has two parts: `identifier` (how to find the site) and `options` (screening parameters).\n\n**Request body shape (OpenAPI schema: `PublicScreeningRequestPayloadV2`):**\n```json\n{\n  \"identifier\": {\n    \"supplierId\": null,\n    \"customerId\": null,\n    \"ownId\": null,\n    \"prewaveId\": 102006215,\n    \"source\": null\n  },\n  \"options\": {\n    \"periodInYears\": 2\n  }\n}\n```\n- **`identifier`:** At least one of `supplierId`, `customerId`, `ownId`, or `prewaveId` must be non-empty / non-null (same semantics as query params on `find-by-identifier`). Optional `source` applies to the string IDs only.\n- **`options.periodInYears`:** Required. Must be **2**, **5**, or **10** (years).\n\n**Asynchronous Processing:**\n- Screening is an asynchronous process that may take several hours to complete.\n- The endpoint returns immediately with `202 Accepted` and the created screening request ID(s).\n- Poll status with the **same** supplier identifiers you used in `identifier`, e.g. `GET /public/v2/suppliers/sites/screening?prewaveId=...` (see get screening status).\n\n**Supplier Identification (`identifier`):**\n- At least one of supplierId, customerId, ownId, or prewaveId must be provided inside `identifier`.\n- **Exactly one supplier must match** (same rules as `DELETE /public/v2/suppliers/sites` and `POST /public/v2/suppliers/sites/identifiers`). If your criteria match zero suppliers, `404` is returned; if more than one, `400` with a multiple-suppliers error.\n- If the matched target is already screened or otherwise ineligible, it may be skipped (reflected by an empty `screeningRequestIds` list in the response).\n\n**Costs:**\n- Screening requests may incur additional costs or consume quota. Ensure your plan supports screening before calling this endpoint.\n\n**Required Permission**: `ACCESS_PUBLIC_SCREENING_REQUEST`\n    "
      operationId: requestScreening
      requestBody:
        description: JSON object with required `identifier` and `options` (`options.periodInYears` = 2, 5, or 10).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicScreeningRequestPayloadV2'
            examples:
              By prewaveId:
                summary: Screen 2 years by Prewave target id
                description: By prewaveId
                value:
                  identifier:
                    prewaveId: 102006215
                  options:
                    periodInYears: 2
              By supplierId and source:
                summary: Screen 5 years by external supplier id
                description: By supplierId and source
                value:
                  identifier:
                    supplierId: SAP-12345
                    source: SAP
                  options:
                    periodInYears: 5
        required: true
      responses:
        '202':
          description: Screening request accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicScreeningCreatedResponseV2'
              examples:
                Screening request accepted:
                  summary: Successfully submitted screening request
                  description: Screening request accepted
                  value:
                    screeningRequestIds:
                    - 10042
                    message: Screening request submitted successfully
        '400':
          description: Bad Request - Invalid payload (e.g. missing identifier/options, periodInYears out of range, or multiple suppliers match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Missing identifiers:
                  summary: No identifier field values provided
                  description: Missing identifiers
                  value:
                    code: invalid_request
                    message: At least one identifier (supplierId, customerId, ownId, prewaveId) must be provided
                    solution: Fix the request
                Multiple suppliers found:
                  summary: Search criteria matches multiple suppliers
                  description: Multiple suppliers found
                  value:
                    code: invalid_request
                    message: 'Multiple suppliers found matching the provided identifiers. Found 2 suppliers with prewaveTargetIds: 102006215, 102006216. Please provide more specific identifiers or use the source parameter.'
                    solution: Fix the request
        '403':
          description: Forbidden - Missing ACCESS_PUBLIC_SCREENING_REQUEST permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '404':
          description: Not Found - No supplier found matching the provided identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Supplier not found:
                  summary: No supplier matches the identifiers
                  description: Supplier not found
                  value:
                    code: resource_not_found
                    message: No supplier found matching the provided identifiers
                    solution: Verify the identifiers and ensure the supplier exists in your organization
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 20,\n        \"requestCount\": 20,\n        \"limits\": [\n            {\n                \"requestLimit\": 20,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
  /public/v2/suppliers/sites/identifiers:
    post:
      tags:
      - Suppliers - Sites
      summary: Create an identifier for a supplier
      description: "\nCreate a new identifier (supplier ID, customer ID, or own site ID) for a supplier using flexible search parameters.\n\n**Related Endpoints:**\n- To find suppliers by identifier, use `GET /public/v2/suppliers/sites/find-by-identifier`.\n- To delete an identifier, use `DELETE /public/v2/suppliers/sites/identifiers`.\n- To create a new supplier, use `POST /public/v2/suppliers/sites`.\n- To get all suppliers, use `GET /public/v2/suppliers/sites`.\n\n**How It Works:**\n\n1. **Find the Supplier**: Provide one or more search parameters to identify the supplier:\n   - `supplierId` (optional): Search by supplier ID\n   - `customerId` (optional): Search by customer ID\n   - `ownId` (optional): Search by own site ID\n   - `prewaveId` (optional): Search by Prewave ID\n   - `source` (optional): Filter by source system (applies to supplierId, customerId, and ownId)\n\n2. **Create the Identifier**: In the request body, specify:\n   - `type`: The type of identifier to create (`supplierId`, `customerId`, or `ownId`)\n   - `id`: The identifier value\n   - `source`: Optional source system (defaults to `PUBLIC_API` if not provided)\n\n**Search Parameters:**\n- `supplierId` (optional): Search by supplier ID\n- `customerId` (optional): Search by customer ID\n- `ownId` (optional): Search by own site ID\n- `prewaveId` (optional): Search by Prewave ID\n- `source` (optional): Filter by source system\n\n**Search Behavior:**\n- Parameters are combined with **OR** logic - suppliers matching ANY of the provided identifiers will be found\n- At least one search parameter must be provided\n- If multiple suppliers match, an error is returned (use `source` parameter to narrow down)\n- If no suppliers match, a 404 error is returned\n\n**Request Body:**\nThe request body specifies what identifier to create:\n- `type`: Must be one of: `supplierId`, `customerId`, `ownId`\n- `id`: The identifier value (e.g., \"SUP-12345\")\n- `source`: Optional source system (e.g., \"SAP\", \"Coupa\")\n\n**Examples:**\n\n1. **Create a supplier ID by searching with prewaveId:**\n   ```\n   POST /public/v2/suppliers/sites/identifiers?prewaveId=102006215\n   Body: {\"type\": \"supplierId\", \"id\": \"SUP-12345\", \"source\": \"SAP\"}\n   ```\n\n2. **Create a customer ID by searching with existing supplier ID:**\n   ```\n   POST /public/v2/suppliers/sites/identifiers?supplierId=SUP-12345&source=SAP\n   Body: {\"type\": \"customerId\", \"id\": \"CUST-67890\", \"source\": \"SAP\"}\n   ```\n\n3. **Create an own site ID by searching with customer ID:**\n   ```\n   POST /public/v2/suppliers/sites/identifiers?customerId=CUST-67890\n   Body: {\"type\": \"ownId\", \"id\": \"OWN-SITE-01\", \"source\": \"SAP\"}\n   ```\n\n**Important Notes:**\n- The combination of identifier value and source must be unique within your organization\n- If the identifier already exists for this supplier, a 409 Conflict error is returned\n- If the identifier exists for a different supplier, a 409 Conflict error is returned\n- All identifier changes are automatically audited\n\n**Required Permission**: `MANAGE_PUBLIC_SUPPLIER_IDS`\n        "
      operationId: createIdentifier
      parameters:
      - name: supplierId
        in: query
        description: Supplier ID to search for. Can be combined with customerId, ownId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: SAP-12345
      - name: customerId
        in: query
        description: Customer ID to search for. Can be combined with supplierId, ownId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: CRM-67890
      - name: ownId
        in: query
        description: Own site ID to search for. Can be combined with supplierId, customerId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: OWN-SITE-01
      - name: prewaveId
        in: query
        description: Prewave ID to search for. Can be combined with supplierId, customerId, and/or ownId.
        required: false
        schema:
          type: integer
          format: int32
        example: 12345
      - name: source
        in: query
        description: Optional source system to filter by. Applies to supplierId, customerId, and ownId (not prewaveId).
        required: false
        schema:
          type: string
        example: SAP
      requestBody:
        description: Identifier creation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicIdentifierCreatePayloadV2'
            examples:
              Create Supplier ID:
                summary: Create a supplier ID
                description: Create Supplier ID
                value:
                  type: supplierId
                  id: SUP-12345
                  source: SAP
              Create Customer ID:
                summary: Create a customer ID
                description: Create Customer ID
                value:
                  type: customerId
                  id: CUST-67890
                  source: SAP
              Create Own Site ID:
                summary: Create an own site ID
                description: Create Own Site ID
                value:
                  type: ownId
                  id: OWN-SITE-01
                  source: SAP
        required: true
      responses:
        '201':
          description: Created - Identifier created successfully.
          headers:
            Location:
              description: URI of the supplier that the identifier was added to
              required: true
              style: simple
              schema:
                type: string
                format: uri
              example: https://api.example.com/public/v2/suppliers/sites/101266998
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIdentifierResponseV2'
              examples:
                Success response:
                  summary: Successful identifier creation
                  description: Success response
                  value:
                    type: supplierId
                    id: SUP-12345
                    source: SAP
                    prewaveTargetId: 101266998
        '400':
          description: '400 Bad Request - Invalid request. This can occur if: (1) no search parameters provided, (2) invalid identifier type, (3) missing required fields in request body, or (4) multiple suppliers found (use source parameter to narrow down).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                No search parameters:
                  summary: No search parameters provided
                  description: No search parameters
                  value:
                    code: invalid_request
                    message: At least one ID parameter (supplierId, customerId, ownId, or prewaveId) must be provided
                    solution: Fix the request
                Invalid identifier type:
                  summary: Invalid identifier type
                  description: Invalid identifier type
                  value:
                    code: invalid_request
                    message: 'Invalid identifier type ''invalidType''. Must be one of: ''supplierId'', ''customerId'', ''ownId'''
                    solution: Fix the request
                Multiple suppliers found:
                  summary: Multiple suppliers match the search criteria
                  description: Multiple suppliers found
                  value:
                    code: invalid_request
                    message: 'Multiple suppliers found matching the provided identifiers. Found 2 suppliers with prewaveTargetIds: 102006215, 102006216. Please provide more specific identifiers or use the source parameter.'
                    solution: Fix the request
        '404':
          description: 404 Not Found - No supplier found matching the provided search parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Supplier not found:
                  summary: No supplier matches the search criteria
                  description: Supplier not found
                  value:
                    code: resource_not_found
                    message: No supplier found matching the provided identifiers
        '409':
          description: '409 Conflict - The identifier already exists. This occurs when: (1) the identifier already exists for this supplier, or (2) the identifier exists for a different supplier in your organization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Duplicate identifier:
                  summary: Identifier already exists
                  description: Duplicate identifier
                  value:
                    code: duplicate_supplier_id
                    message: Duplicate supplier IDs - id=SUP-12345, others_found=1, source=SAP
                    solution: Please provide unique supplier IDs
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 20,\n        \"requestCount\": 20,\n        \"limits\": [\n            {\n                \"requestLimit\": 20,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
    delete:
      tags:
      - Suppliers - Sites
      summary: Delete an identifier for a supplier
      description: "\nDelete an identifier (supplier ID, customer ID, or own site ID) from all suppliers in your organization.\n\n**Related Endpoints:**\n- To create an identifier, use `POST /public/v2/suppliers/sites/identifiers`.\n- To find suppliers by identifier, use `GET /public/v2/suppliers/sites/find-by-identifier`.\n- To get all suppliers, use `GET /public/v2/suppliers/sites`.\n\n**How It Works:**\n\nThis endpoint deletes a specific identifier across all suppliers that have it. You specify:\n- `type`: The type of identifier to delete (`supplierId`, `customerId`, or `ownId`)\n- `id`: The identifier value to delete\n- `source`: Optional source system of the identifier to delete\n\n**Query Parameters:**\n- `type` (required): Must be one of: `supplierId`, `customerId`, `ownId`\n- `id` (required): The identifier value (e.g., \"SUP-12345\")\n- `source` (optional): Source system (e.g., \"SAP\", \"Coupa\"). If not provided, will search for identifiers without a source or with the default source.\n\n**Examples:**\n\n1. **Delete a supplier ID:**\n   ```\n   DELETE /public/v2/suppliers/sites/identifiers?type=supplierId&id=SUP-12345&source=SAP\n   ```\n\n2. **Delete a customer ID:**\n   ```\n   DELETE /public/v2/suppliers/sites/identifiers?type=customerId&id=CUST-67890&source=SAP\n   ```\n\n3. **Delete an own site ID:**\n   ```\n   DELETE /public/v2/suppliers/sites/identifiers?type=ownId&id=OWN-SITE-01&source=SAP\n   ```\n\n**Important Notes:**\n- The identifier must exist for at least one supplier\n- If the identifier doesn't exist, a 404 Not Found error is returned\n- All identifier changes are automatically audited\n- If `source` is not provided, the system will search for identifiers without a source or with the default source\n\n**Required Permission**: `MANAGE_PUBLIC_SUPPLIER_IDS`\n        "
      operationId: deleteIdentifier
      parameters:
      - name: type
        in: query
        description: The type of identifier to delete
        required: true
        schema:
          $ref: '#/components/schemas/IdentifierType'
        example: SUPPLIER_ID
      - name: id
        in: query
        description: The identifier value to delete
        required: true
        schema:
          type: string
