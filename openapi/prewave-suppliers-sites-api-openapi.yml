                    earliestAlert: '2023-02-15T10:30:00Z'
                    siteGroup:
                      id: 500001
                      name: Acme Corporation Group
                    connectionContactsCount: 5
                Multiple Suppliers Found:
                  summary: Response with multiple suppliers matching different IDs
