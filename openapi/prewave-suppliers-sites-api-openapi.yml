  /public/v2/suppliers/sites/find-by-identifier:
    get:
      tags:
      - Suppliers - Sites
      summary: Find suppliers by ID
      description: "\nFind suppliers/sites by their identifiers (supplier ID, customer ID, own site ID, or Prewave ID) with optional source.\n\nThis unified endpoint allows you to search for suppliers using any type of identifier from external systems (e.g., SAP, Coupa, DNB). You can search by one or more ID types simultaneously.\n\n**Related Endpoints:**\n- To get all suppliers with pagination, use `GET /public/v2/suppliers/sites`.\n- To create a new supplier, use `POST /public/v2/suppliers/sites`.\n- To create an identifier for a supplier, use `POST /public/v2/suppliers/sites/identifiers`.\n- To delete an identifier, use `DELETE /public/v2/suppliers/sites/identifiers`.\n- To deactivate a supplier, use `DELETE /public/v2/suppliers/sites`.\n\n**Search Parameters:**\n- `supplierId` (optional): Search by supplier ID\n- `customerId` (optional): Search by customer ID\n- `ownId` (optional): Search by own site ID\n- `prewaveId` (optional): Search by Prewave ID\n- `source` (optional): Filter by source system (e.g., \"SAP\", \"Coupa\", \"PUBLIC_API\")\n\n**Search Behavior:**\n- **Multiple ID types**: If you provide multiple ID parameters (e.g., both `supplierId` and `customerId`), the endpoint returns suppliers that match **ANY** of the provided IDs (OR logic).\n- **Source filtering**: If `source` is provided, only IDs with that exact source are matched. If `source` is not provided, IDs with any source or without a source (legacy IDs) are matched. Note: `source` does not apply to `prewaveId` searches.\n- **Multiple results**: The same ID can be associated with multiple suppliers/sites in your organization, so the endpoint returns a list.\n- **Empty results**: Returns an empty list if no suppliers match the search criteria.\n\n**Response Format:**\nReturns a list of `PublicSupplierDetailV2DTO` objects with complete supplier information including:\n- Basic identification (Prewave Target ID, name, LinkedIn ID)\n- Location details (address, city, country code, postal code)\n- Company information (website, description, logo, year founded, size)\n- All supplier IDs, customer IDs, and own site IDs\n- Screening status and monitoring dates\n- Site-group reference\n- Connection contacts count\n\n**Use Cases:**\n\n1. **Find by single ID type:**\n   ```\n   GET /suppliers/sites/find-by-identifier?supplierId=SAP-12345&source=SAP\n   ```\n\n2. **Find by multiple ID types (returns suppliers matching ANY):**\n   ```\n   GET /suppliers/sites/find-by-identifier?supplierId=SAP-12345&customerId=CRM-67890&source=SAP\n   ```\n\n3. **Find without source filter (matches any source):**\n   ```\n   GET /suppliers/sites/find-by-identifier?supplierId=SUP-12345\n   ```\n\n4. **Find by Prewave ID:**\n   ```\n   GET /suppliers/sites/find-by-identifier?prewaveId=12345\n   ```\n\n**Important Notes:**\n- At least one ID parameter (supplierId, customerId, ownId, or prewaveId) must be provided\n- The endpoint returns full supplier details (PublicSupplierDetailV2DTO), not just basic info\n- All IDs for each supplier are included in the response (not just the matching ones)\n- Results are ordered alphabetically by name, then by ID for deterministic ordering\n\n**Required Permission**: `ACCESS_PUBLIC_SUPPLIERS`\n        "
      operationId: findSuppliers
      parameters:
      - name: supplierId
        in: query
        description: Supplier ID to search for. Can be combined with customerId, ownId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: SAP-12345
      - name: customerId
        in: query
        description: Customer ID to search for. Can be combined with supplierId, ownId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: CRM-67890
      - name: ownId
        in: query
        description: Own site ID to search for. Can be combined with supplierId, customerId, and/or prewaveId.
        required: false
        schema:
          type: string
        example: OWN-SITE-01
      - name: prewaveId
        in: query
        description: Prewave ID to search for. Can be combined with supplierId, customerId, and/or ownId.
        required: false
        schema:
          type: integer
          format: int32
        example: 12345
      - name: source
        in: query
        description: Optional source system to filter by. If not provided, matches IDs with any source or without a source. Applies to all provided ID parameters.
        required: false
        schema:
          type: string
        example: SAP
      responses:
        '200':
          description: Successfully found suppliers. Returns empty list if no matches found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicSupplierDetailV2DTO'
              examples:
                Single Supplier Found:
                  summary: Response with one supplier
                  description: Single Supplier Found
                  value:
                  - prewaveTargetId: 102006215
                    name: Acme Manufacturing
                    sname: Vienna Industrial District
                    linkedInId: acme-manufacturing
                    address: 123 Main St, Vienna, Austria
                    city: Vienna
                    countryCode: AT
                    postalCode: '1010'
                    website: https://www.acme-corp.com
                    description: Leading manufacturer of electronic components
                    logo: /images/company-img/acme-logo.jpg
                    yearFounded: 1999
                    size: Medium
                    supplierIds:
                    - id: SAP-12345
                      source: SAP
                    - id: COUPA-67890
                      source: Coupa
                    customerIds:
                    - id: CRM-ABC-001
                      source: Salesforce
                    ownIds: []
                    screened: true
                    screenedStatus: Screened
                    monitoredSince: '2023-01-01T12:00:00Z'
                    earliestAlert: '2023-02-15T10:30:00Z'
                    siteGroup:
                      id: 500001
                      name: Acme Corporation Group
                    connectionContactsCount: 5
                Multiple Suppliers Found:
                  summary: Response with multiple suppliers matching different IDs
                  description: Multiple Suppliers Found
                  value:
                  - prewaveTargetId: 102006215
                    name: Acme Manufacturing
                    address: 123 Main St, Vienna, Austria
                    city: Vienna
                    countryCode: AT
                    supplierIds:
                    - id: SAP-12345
                      source: SAP
                    customerIds: []
                    ownIds: []
                    screened: true
                    connectionContactsCount: 3
                  - prewaveTargetId: 102006216
                    name: Beta Industries
                    address: 456 Business Ave, Berlin, Germany
                    city: Berlin
                    countryCode: DE
                    supplierIds: []
                    customerIds:
                    - id: CRM-67890
                      source: Salesforce
                    ownIds: []
                    screened: false
                    connectionContactsCount: 1
                No Suppliers Found:
                  summary: Empty list when no suppliers match
                  description: No Suppliers Found
                  value: []
        '400':
          description: 400 Bad Request - Invalid request. At least one ID parameter must be provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Missing ID parameters:
                  summary: No ID parameters provided
                  description: Missing ID parameters
                  value:
                    code: invalid_request
                    message: At least one ID parameter (supplierId, customerId, or ownId) must be provided
                    solution: Fix the request
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 100,\n        \"requestCount\": 100,\n        \"limits\": [\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 500,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
