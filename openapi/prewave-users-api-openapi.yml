          type:
          - string
          - 'null'
          example: null
        teamIds:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
            example: null
          example: null
        roleNames:
          type:
          - array
          - 'null'
          items:
            type: string
            example: null
          example: null
        planId:
          type:
          - integer
          - 'null'
          format: int32
          example: null
      example: null
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
