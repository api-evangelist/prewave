        minShipments:
          type: integer
          description: Minimum number of shipments required for a relationship to be included. Higher values filter out less established relationships. Null means no minimum.
          format: int32
          nullable: true
          example: 5
        probability:
          type: integer
          description: Minimum probability threshold for predicted relationships (0-100). Higher values return only high-confidence predictions. Null means no threshold.
          format: int32
          nullable: true
          example: 75
        shipmentsPeriodFrom:
