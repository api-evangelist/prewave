      description: Response returned when API rate limit is exceeded (HTTP 429)
      example: null
    PublicSupplierGraphShipment:
      required:
      - hscode
      type: object
      properties:
        hscode:
          type: integer
          description: HS code (6 digits)
          format: int32
          example: 847330
        nShipments:
          type: integer
          description: Number of shipments observed for this HS code
          format: int32
          nullable: true
          writeOnly: true
          example: 5
        lastShipment:
          type: string
          description: Date of the last observed shipment for this HS code
          format: date
          nullable: true
          example: '2024-03-15'
        nshipments:
          type: integer
          format: int32
          example: null
      description: Shipment details for a supplier relationship, grouped by HS code
      example: null
    PublicSupplierGraphEntry:
      required:
      - customerId
      - source
      - supplierId
      - tier
      type: object
      properties:
        tier:
          type: integer
          description: Tier number of the relationship (1 = direct)
          format: int32
          example: 2
        supplierId:
          type: integer
          description: Supplier node identifier
          format: int32
          example: 4567
        customerId:
          type: integer
          description: Customer/target node identifier
          format: int32
          example: 1234
        source:
          type: string
          description: Source of the supplier relationship edge
          enum:
          - Customer
          - Media
          - Customs
          - PrewavePrediction
          example: null
        probability:
          type: integer
          description: Confidence or probability for the relationship in percent (0-100)
          format: int32
          nullable: true
          example: 87
        mediaSources:
          type: array
          description: List of media source URLs used to derive MEDIA edges; present only when includeMediaSources=true
          nullable: true
          example:
          - https://example.com/article-1
          - https://example.com/article-2
          items:
            type: string
            description: List of media source URLs used to derive MEDIA edges; present only when includeMediaSources=true
            example: '["https://example.com/article-1","https://example.com/article-2"]'
        nShipments:
          type: integer
          description: Number of shipments observed for this supplier/target pair (if shipments filtering is active)
          format: int32
          nullable: true
          writeOnly: true
          example: 3
        shipments:
          type: array
          description: Detailed shipment information per HS code; present only when includeShipmentDetails=true
          nullable: true
          items:
            $ref: '#/components/schemas/PublicSupplierGraphShipment'
          example: null
        nshipments:
          type: integer
          format: int32
          example: null
      description: Single supplier relationship entry in the supplier graph
      example: null
  securitySchemes:
    Token authentication:
      type: apiKey
      description: Generate an API token at https://www.prewave.com/management/api and paste it in here.
      name: X-Auth-Token
      in: header
