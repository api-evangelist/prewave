      responses:
        '200':
          description: Successfully retrieved tier-n collection supplier graph.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicTierNCollectionGraphEntry'
              examples:
                Tier-N Graph - Basic:
                  summary: Sample with direct and indirect suppliers
                  description: Tier-N Graph - Basic
                  value: '[{"tier":1,"supplierTargetId":4567,"customerTargetId":1234,"source":"Customs","probability":null,"mediaSources":null,"shipments":null,"nshipments":15},{"tier":2,"supplierTargetId":7890,"customerTargetId":4567,"source":"Customs","probability":null,"mediaSources":null,"shipments":null,"nshipments":8}]'
                Tier-N Graph - With Shipment Details:
                  description: Tier-N Graph - With Shipment Details
                  value: '[{"tier":1,"supplierTargetId":4567,"customerTargetId":1234,"source":"Customs","probability":null,"mediaSources":null,"shipments":[{"hscode":847330,"lastShipment":{"date":"2024-03-15","_datetype_":"Date"},"nshipments":10}],"nshipments":15}]'
                Tier-N Graph - With Predictions:
                  description: Tier-N Graph - With Predictions
                  value: '[{"tier":3,"supplierTargetId":9999,"customerTargetId":7890,"source":"PrewavePrediction","probability":87,"mediaSources":null,"shipments":null,"nshipments":null}]'
        '400':
          description: Collection not tier-n enabled or invalid parameters (e.g. tier/maxTier out of range).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Not tier-n collection:
                  description: Not tier-n collection
                  value: '{"code":"INVALID_REQUEST","message":"Only tier-n collections can be used by this endpoint. Collection 123 does not have tiers enabled.","solution":"Use a collection with tiersEnabled=true"}'
                Invalid tier:
                  description: Invalid tier
                  value: '{"code":"INVALID_REQUEST","message":"Tier must be within 1..9 range","solution":"Provide a valid tier value between 1 and 9"}'
        '404':
          description: Collection not found, inactive, not tier-n enabled, or not accessible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Collection not found:
                  description: Collection not found
                  value: '{"code":"RESOURCE_NOT_FOUND","message":"Collection not found: ID=123","solution":"Check collection ID or verify access permissions"}'
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 100,\n        \"requestCount\": 100,\n        \"limits\": [\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 500,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
components:
  schemas:
    PublicTierNCollectionGraphEntry:
      required:
      - customerTargetId
      - source
      - supplierTargetId
      - tier
      type: object
      properties:
        tier:
          type: integer
          description: Tier number of the relationship. Tier 1 = direct suppliers, Tier 2 = suppliers of suppliers, etc. Higher tiers represent deeper supply chain connections.
          format: int32
          example: 2
        supplierTargetId:
          type: integer
          description: Unique identifier of the supplier target in this relationship. Use this ID to look up additional supplier information via other APIs.
          format: int32
          example: 4567
        customerTargetId:
          type: integer
          description: Unique identifier of the customer target in this relationship. This represents the 'from' side of the supplier relationship.
          format: int32
          example: 1234
        source:
          type: string
          description: Source of the supplier relationship edge
          enum:
          - Customer
          - Media
          - Customs
          - PrewavePrediction
          example: null
        probability:
          type: integer
          description: Confidence or probability score for the relationship (0-100). Only present for PREWAVE_PREDICTION sources. Higher values indicate more confident predictions.
          format: int32
          nullable: true
          example: 87
        mediaSources:
          type: array
          description: List of media source URLs used to derive this MEDIA-type relationship. Only present when source=MEDIA and includeMediaSources=true. These URLs provide evidence for the relationship.
          nullable: true
          example:
          - https://example.com/article-1
          - https://example.com/article-2
          items:
            type: string
            description: List of media source URLs used to derive this MEDIA-type relationship. Only present when source=MEDIA and includeMediaSources=true. These URLs provide evidence for the relationship.
            example: '["https://example.com/article-1","https://example.com/article-2"]'
        nShipments:
          type: integer
          description: Number of shipments observed for this supplier/customer pair. Only present for CUSTOMS sources. Indicates the strength of the business relationship based on trade data.
          format: int32
          nullable: true
          writeOnly: true
          example: 3
        shipments:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/PublicTierNCollectionGraphShipment'
          example: null
        nshipments:
          type: integer
          format: int32
          example: null
      description: "\n        Single supplier relationship entry in the tier-n collection graph.\n\n        Each entry represents a relationship between a customer and supplier at a specific\n        tier level, along with metadata about how this relationship was discovered and\n        its confidence level.\n\n        ## Understanding Tiers\n        - **Tier 1**: Direct suppliers (immediate business relationships)\n        - **Tier 2**: Suppliers of your suppliers (second-degree relationships)\n        - **Tier 3+**: Deeper supply chain connections\n\n        ## Data Sources\n        - **CUSTOMS**: Based on shipment data (most reliable)\n        - **MEDIA**: Based on news/media reports\n        - **CUSTOMER**: Based on customer-provided data\n        - **PREWAVE_PREDICTION**: AI-predicted relationships\n\n        ## Optional Fields\n        - `probability`: Only present for PREWAVE_PREDICTION sources\n        - `mediaSources`: Only present for MEDIA sources when requested\n        - `nShipments`: Only present for CUSTOMS sources\n        - `shipments`: Only present when includeShipmentDetails=true\n    "
      example: null
    PublicTierNCollectionSettingsUpdateRequest:
      type: object
      properties:
        maxTier:
          maximum: 9
          minimum: 1
          type: integer
          description: 'Maximum tier level configured for analysis. Range: 1-9. Higher values allow deeper supply chain analysis but may increase response time.'
          format: int32
          nullable: true
          example: 3
        scopePrivate:
          type: boolean
          description: Whether to include private targets in the analysis scope. Private targets typically represent internal company data.
          nullable: true
          example: true
        scopeShared:
          type: boolean
          description: Whether to include shared targets in the analysis scope. Shared targets typically represent partner/team data.
          nullable: true
          example: true
        scopePublic:
          type: boolean
          description: Whether to include public targets in the analysis scope. Public targets typically represent open/public data.
          nullable: true
          example: false
        sourceCustomer:
          type: boolean
          description: Whether to include customer data sources in the analysis. Customer data comes from customer-provided information.
          nullable: true
          example: true
        sourceCustoms:
          type: boolean
          description: Whether to include customs data sources in the analysis. Customs data is typically the most reliable source based on shipment records.
          nullable: true
          example: true
        sourceMedia:
          type: boolean
          description: Whether to include media data sources in the analysis. Media data comes from news reports and may be less reliable.
          nullable: true
          example: false
        sourcePrewavePrediction:
          type: boolean
          description: Whether to include Prewave prediction data sources in the analysis. These are AI-predicted relationships with confidence scores.
          nullable: true
          example: true
        minShipments:
          minimum: 0
          type: integer
          description: Minimum number of shipments required for a relationship to be included. Higher values filter out less established relationships. Set to null to remove minimum.
          format: int32
          nullable: true
          example: 5
        probability:
          maximum: 100
          minimum: 0
          type: integer
          description: Minimum probability threshold for predicted relationships (0-100). Higher values return only high-confidence predictions. Set to null to remove threshold.
          format: int32
          nullable: true
          example: 75
        shipmentsPeriodFrom:
          type: string
          description: 'Start date for shipment period analysis. Only relationships with shipments in this period are considered. Format: YYYY-MM-DD. Set to null to remove start date limit.'
          format: date
          nullable: true
          example: '2024-01-01'
        shipmentsPeriodTo:
          type: string
          description: 'End date for shipment period analysis. Only relationships with shipments in this period are considered. Format: YYYY-MM-DD. Set to null to remove end date limit.'
          format: date
          nullable: true
          example: '2024-12-31'
        suspectedSuppliers:
          type: boolean
          description: Whether to include suspected suppliers in the analysis. Suspected suppliers are flagged as potentially risky or suspicious.
          nullable: true
          example: false
        logisticsProvider:
          type: boolean
          description: Whether to include logistics providers in the analysis. Logistics providers are companies that provide logistics services rather than direct suppliers.
          nullable: true
          example: false
      description: "\n        Request payload for updating tier-n collection settings.\n\n        This class contains the configuration settings that can be updated for a tier-n enabled collection.\n        All fields are optional, allowing partial updates of the collection settings.\n\n        ## Configuration Categories\n\n        ### Tier Configuration\n        - `maxTier`: Maximum tier level for analysis (1-9)\n\n        ### Scope Settings\n        - `scopePrivate/Shared/Public`: Which target types to include in analysis\n\n        ### Data Source Settings\n        - `source*`: Which data sources to use for relationship discovery\n\n        ### Filtering Parameters\n        - `minShipments`: Minimum shipment count threshold\n        - `probability`: Minimum confidence threshold for predictions\n        - `shipmentsPeriodFrom/To`: Time period for shipment analysis\n        - `suspectedSuppliers`: Include flagged suppliers\n        - `logisticsProvider`: Include logistics service providers\n    "
      example: null
    AccessDeniedErrorDTO:
      required:
      - code
      - loggedIn
      - message
      type: object
      properties:
        loggedIn:
          type: boolean
          example: null
        permission:
          type: string
          nullable: true
          example: null
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type: string
          description: Possible solution to the error
          nullable: true
          example: null
      example: null
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type: string
          description: Possible solution to the error
          nullable: true
          example: null
      description: Error response
      example: null
    PublicTierNCollectionGraphShipment:
      required:
      - hscode
      type: object
      properties:
        hscode:
          type: integer
          description: 6-digit HS (Harmonized System) code identifying the product category. Used internationally for trade classification.
          format: int32
          example: 847330
        nShipments:
          type: integer
          description: Number of shipments observed for this specific HS code in the relationship. Indicates the volume of trade activity for this product category.
          format: int32
          nullable: true
          writeOnly: true
          example: 5
        lastShipment:
          type: string
          description: 'Date of the most recent shipment observed for this HS code. Format: YYYY-MM-DD. Useful for assessing recency of product-specific activity.'
          format: date
          nullable: true
          example: '2024-03-15'
        nshipments:
          type: integer
          format: int32
          example: null
      description: "\n        Detailed shipment information for a specific HS code within a supplier relationship.\n\n        This provides granular shipment data broken down by product category (HS code),\n        showing the volume and recency of trade activity for specific products between\n        the supplier and customer.\n\n        ## HS Codes\n        HS (Harmonized System) codes are 6-digit product classification codes used\n        internationally for trade. They help identify specific product categories\n        involved in the business relationship.\n\n        ## Use Cases\n        - **Product Analysis**: Understand which products drive the relationship\n        - **Volume Assessment**: See shipment frequency and volume per product\n        - **Recency Tracking**: Identify the most recent activity per product\n        - **Risk Analysis**: Assess dependency on specific product categories\n    "
      example: null
