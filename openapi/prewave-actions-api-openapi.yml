  /public/v1/actions/types:
    get:
      tags:
      - Actions
      summary: List action types
      description: 'Retrieves a list of all action types available for your organization.


        For detailed information about actions, action types, and action statuses, see the Prewave Help Center.


        **Quick Start:**

        ```

        GET /public/v1/actions/types

        ```


        **Response Format:**

        Returns all action types accessible to your organization. Each action type includes:

        - `id` - Internal action type identifier

        - `displayName` - Human-readable name for display in UI


        **Filtering:**

        Action types are automatically filtered to show only those:

        - Available for your organization

        - Not excluded for your user/role

        - Marked as public


        **Use Cases:**

        - Discover available action types for dropdown/select UI components

        - Display action type information in user interfaces

        - Find valid `typeId` values for filtering actions (`GET /public/v1/actions?typeIds=...`)


        **Related Operations:**

        - `GET /public/v1/actions/types/{typeId}` - Get details for a specific action type

        - `GET /public/v1/actions?typeIds={typeId}` - Filter actions by type ID


        **Required Permission:** `access_public_actions`'
      operationId: listActionTypes
      responses:
        '200':
          description: Successfully retrieved action types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicActionTypeDTO'
              examples:
                Action types list:
                  description: Action types list
                  value: '[{"id":5,"displayName":"Incident Review"},{"id":6,"displayName":"Self Assessment Request"},{"id":7,"displayName":"Code of Conduct Review"}]'
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
