          description: Due date (ISO 8601 timestamp)
          format: date-time
          nullable: true
          example: '2024-12-31T23:59:59Z'
        createdAt:
          type: string
          description: Creation timestamp (ISO 8601 timestamp)
          format: date-time
          example: '2024-01-15T10:30:00Z'
