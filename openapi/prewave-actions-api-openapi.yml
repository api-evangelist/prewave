components:
  schemas:
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
          example: null
        sorted:
          type: boolean
          example: null
        unsorted:
          type: boolean
          example: null
      example: null
    PublicActionDTO:
      required:
      - actionId
      - assignees
      - createdAt
      - status
      - target
      - teams
      - title
      - type
      - updatedAt
      type: object
