          format: int32
          example: null
        size:
          minimum: 1
          type: integer
          format: int32
          example: null
        sort:
          type: array
          items:
            type: string
            example: null
          example: null
      example: null
    ApiRateLimitTimeRequestLimit:
      type: object
      properties:
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in this time window
          format: int32
          example: 100
        timeInSeconds:
          type: integer
