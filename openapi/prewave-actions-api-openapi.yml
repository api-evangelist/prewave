        empty:
          type: boolean
          example: null
      example: null
    PublicActionDTO:
      required:
      - actionId
      - assignees
      - createdAt
      - status
      - target
      - teams
      - title
      - type
      - updatedAt
      type: object
      properties:
        actionId:
          type: integer
          description: Public-facing action key
          format: int32
          example: 12345
        title:
          type: string
          description: Action title
