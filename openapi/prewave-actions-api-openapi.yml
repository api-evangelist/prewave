  /public/v1/actions/statuses:
    get:
      tags:
      - Actions
      summary: List action statuses for type
      description: 'Retrieves a list of action statuses that are valid for a specific action type.


        For detailed information about actions, action types, and action statuses, see the Prewave Help Center.


        **Quick Start:**

        ```

        GET /public/v1/actions/statuses?typeId=5

        ```


        **Response Format:**

        Returns only the statuses that are valid for the specified action type. This is essential for:

        - Building type-specific status selection UI components

        - Understanding which statuses can be assigned to actions of a specific type


        **Status Transitions:**

        Each action type has a defined set of valid statuses.


        **Use Cases:**

        - Discover valid statuses for a specific action type

        - Build dynamic UI that only shows valid statuses for each action type


        **Finding Action Type IDs:**

        Use `GET /public/v1/actions/types` to find valid `typeId` values.


        **Related Operations:**

        - `GET /public/v1/actions/types` - List all available action types

        - `GET /public/v1/actions/statuses` - List all statuses (not filtered by type)


        **Required Permission:** `access_public_actions`'
      operationId: listActionStatusesForType
      parameters:
      - name: typeId
        in: query
        description: Action type ID. Use GET /public/v1/actions/types to find action type IDs.
        required: true
        schema:
          type: integer
          format: int32
        example: 5
      responses:
        '200':
          description: Successfully retrieved action statuses for the specified type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicActionStatusDTO'
              examples:
                Action statuses list:
                  description: Action statuses list
                  value: '[{"id":1,"title":"Planned","state":"Planned"},{"id":2,"title":"In Progress","state":"InProgress"},{"id":3,"title":"Completed","state":"Completed"},{"id":4,"title":"Aborted","state":"Aborted"}]'
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicActionStatusDTO'
        '404':
          description: 404 Not Found - The action type with the specified ID was not found or is not accessible to your organization.
          content:
