  /public/v1/actions/types/{typeId}:
    get:
      tags:
      - Actions
      summary: Get action type by ID
      description: 'Retrieves detailed information about a specific action type.


        For detailed information about actions, action types, and action statuses, see the Prewave Help Center.


        **Quick Start:**

        ```

        GET /public/v1/actions/types/5

        ```


        **Response Format:**

        Returns the action type details including ID and display name.


        **Use Cases:**

        - Display action type information in detail views

        - Check if a specific action type is available for your organization


        **Related Operations:**

        - `GET /public/v1/actions/types` - List all available action types

        - `GET /public/v1/actions?typeIds={typeId}` - Filter actions by this type ID


        **Required Permission:** `access_public_actions`'
      operationId: getActionTypeById
      parameters:
      - name: typeId
        in: path
        description: Action type ID. Use GET /public/v1/actions/types to find action type IDs.
        required: true
        schema:
          type: integer
          format: int32
        example: 5
      responses:
        '200':
          description: Action type found and returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicActionTypeDTO'
              examples:
                Action type detail:
                  description: Action type detail
                  value: '{"id":5,"displayName":"Incident Review"}'
        '404':
