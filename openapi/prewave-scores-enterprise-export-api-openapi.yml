openapi: 3.2.0
info:
  title: Public Prewave Scores - Enterprise Export API
  description: Documentation of the Public Prewave API.
  version: '1.0'
servers:
- url: https://api.prewave.com
  description: Production Environment
security:
- Token authentication: []
tags:
- name: Scores - Enterprise Export
  description: Public API for managing enterprise export configurations and retrieving score data in Prewave's supply chain network.
paths:
  /public/v1/enterprise-export/scores/config:
    get:
      tags:
      - Scores - Enterprise Export
      summary: Get Export Configuration
      description: Retrieve the current export configuration for the authenticated user.
      operationId: getExportConfiguration
      responses:
        '200':
          description: Configuration successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicScoreExecutionConfig'
              examples:
                Active configuration:
                  summary: Sample active export configuration
                  description: An active configuration with collections, targets, and perspectives configured. The job will run automatically based on the WEEKLY interval.
                  value:
                    runInterval: WEEKLY
                    enabled: true
                    collectionIds:
                    - 123
                    - 456
                    - 789
                    targetIds:
                    - 102006215
                    - 101641243
                    - 10422185
                    perspectiveIds:
                    - 1
                    - 2
                    - 3
                    includeComponents: false
                Disabled configuration:
                  summary: Configuration with job disabled
                  description: A configuration that exists but is disabled. The job will not run even if the interval has elapsed.
                  value:
                    runInterval: DAILY
                    enabled: false
                    collectionIds:
                    - 123
                    - 456
                    targetIds:
                    - 102006215
                    perspectiveIds:
                    - 1
                    includeComponents: true
                Default configuration:
                  summary: Default configuration when none exists
                  description: The default configuration returned when no configuration has been created yet. The empty `perspectiveIds` array (`[]`) indicates an incomplete/disabled configuration. You must provide at least one perspective ID when creating or updating a configuration, otherwise no scores will be generated during execution.
                  value:
                    runInterval: WEEKLY
                    enabled: false
                    collectionIds: []
                    targetIds: []
                    perspectiveIds: []
                    includeComponents: false
                High-frequency configuration:
                  summary: Configuration with frequent execution
                  description: A configuration set to run every 6 hours with components enabled for detailed score breakdowns.
                  value:
                    runInterval: SIX_HOURS
                    enabled: true
                    collectionIds:
                    - 123
                    targetIds:
                    - 102006215
                    - 101641243
                    perspectiveIds:
                    - 1
                    - 2
                    includeComponents: true
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 100,\n        \"requestCount\": 100,\n        \"limits\": [\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 500,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
    post:
      tags:
      - Scores - Enterprise Export
      summary: Create or Update Export Configuration
      description: Create a new export configuration or update the existing one for the authenticated user.
      operationId: createOrUpdateExportConfiguration
      requestBody:
        description: Request payload containing the export job configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicScoreExecutionConfig'
        required: true
      responses:
        '200':
          description: Configuration successfully created or updated. The response contains the complete configuration that was saved, including any default values applied (e.g., runInterval defaults to WEEKLY if not specified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicScoreExecutionConfig'
              examples:
                Created configuration:
                  summary: Successfully created new configuration
                  description: Response after creating a new configuration. All fields are returned as saved.
                  value:
                    runInterval: WEEKLY
                    enabled: true
                    collectionIds:
                    - 123
                    - 456
                    targetIds:
                    - 102006215
                    - 101641243
                    perspectiveIds:
                    - 1
                    - 2
                    includeComponents: false
                Updated configuration:
                  summary: Successfully updated existing configuration
                  description: Response after updating an existing configuration. The previous configuration was completely replaced.
                  value:
                    runInterval: DAILY
                    enabled: true
                    collectionIds:
                    - 789
                    - 101
                    targetIds:
                    - 10422185
                    perspectiveIds:
                    - 1
                    - 2
                    - 3
                    includeComponents: true
                Configuration with default interval:
                  summary: Configuration with default WEEKLY interval
                  description: When runInterval is omitted, it defaults to WEEKLY in the response.
                  value:
                    runInterval: WEEKLY
                    enabled: true
                    collectionIds:
                    - 123
                    targetIds: []
                    perspectiveIds:
                    - 1
                    includeComponents: false
        '400':
          description: 400 Bad Request - Invalid request payload or validation errors. The request body is malformed, contains invalid data types, or has validation errors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Invalid run interval:
                  summary: Invalid runInterval enum value
                  description: The runInterval value must be one of the valid enum values.
                  value:
                    code: validation_error
                    message: 'Invalid run interval. Must be one of: SIX_HOURS, TWELVE_HOURS, DAILY, WEEKLY'
                    details:
                      field: runInterval
                      value: INVALID_INTERVAL
                Missing required field:
                  summary: Required field is missing
                  description: All required fields must be present in the request.
                  value:
                    code: validation_error
                    message: Required field 'enabled' is missing
                    solution: Include all required fields in the request
                Invalid JSON:
                  summary: Request body is not valid JSON
                  description: The request body must be valid JSON format.
                  value:
                    code: invalid_request
                    message: 'JSON parse error: Unexpected character'
                    solution: Fix the JSON format
                Invalid field type:
                  summary: Field has wrong data type
                  description: Fields must have the correct data types (e.g., enabled must be boolean, not string).
                  value:
                    code: validation_error
                    message: Invalid type for field 'enabled'. Expected boolean, got string
                    details:
                      field: enabled
                      expectedType: boolean
                      actualType: string
        '404':
          description: '404 Not Found - One or more collections, targets, or perspectives specified in the configuration were not found or are not accessible to the authenticated user. Note: This validation typically occurs during job execution, not at configuration time. However, if immediate validation is performed and resources are not accessible, this error will be returned.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Collection not found:
                  summary: Collection ID not found or not accessible
                  description: One of the specified collection IDs does not exist or the user does not have access to it.
                  value:
                    code: resource_not_found
                    message: Collection with ID 999 not found or not accessible
                    details:
                      resourceType: Collection
                      resourceId: 999
                    solution: Verify the collection ID and ensure you have access to it
                Target not found:
                  summary: Target ID not found or not accessible
                  description: One of the specified target IDs does not exist or the user does not have access to it.
                  value:
                    code: resource_not_found
                    message: Target with ID 999999 not found or not accessible
                    details:
                      resourceType: Target
                      resourceId: 999999
                    solution: Verify the target ID and ensure it belongs to your organization
                Perspective not found:
                  summary: Perspective ID not found or not accessible
                  description: One of the specified perspective IDs does not exist or the user does not have access to it.
                  value:
                    code: resource_not_found
                    message: Perspective with ID 99 not found or not accessible
                    details:
                      resourceType: Perspective
                      resourceId: 99
                    solution: Verify the perspective ID and ensure it is available in your organization
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 20,\n        \"requestCount\": 20,\n        \"limits\": [\n            {\n                \"requestLimit\": 20,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
  /public/v1/enterprise-export/scores:
    get:
      tags:
      - Scores - Enterprise Export
      summary: Retrieve Latest Score Results
      description: Retrieve a paginated list of the most recent score results for the authenticated user.
      operationId: getScoreResults
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Score results successfully retrieved. Returns a paginated response containing score data entries from the most recent successful execution.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicScoreDataEntry'
                  size:
                    type: integer
                    format: int32
                  number:
                    type: integer
                    format: int32
                  totalElements:
                    type: integer
                    format: int32
                  totalPages:
                    type: integer
                    format: int32
                  numberOfElements:
                    type: integer
                    format: int32
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
              examples:
                Score results - Basic:
                  summary: Sample paginated score results response
                  description: 'Basic score results without components. Action priority is included when available. Note: Fields with null values (such as `riskLevel`, `actionPriority`, `groups`, `components`, `subComponents`) are omitted from the JSON response.'
                  value:
                    content:
                    - targetId: 102006215
                      targetName: Inter Cars SA
                      edgeNumbers:
                      - number: SUP-12345
                        source: SAP
                        existingEdgeId: 102006215
                      - number: BNOID-67890
                        existingEdgeId: 102006215
                      perspectiveId: 1
                      perspectiveName: LKSG
                      calculatedAt: '2025-01-20T10:30:00'
                      score: 85
                      riskLevel: LOW
                      actionPriority:
                        value: 68
                        riskLevel: High
                    - targetId: 101641243
                      targetName: Acme Corporation
                      edgeNumbers:
                      - number: COUPA-54321
                        source: Coupa
                        existingEdgeId: 101641243
                      perspectiveId: 1
                      perspectiveName: LKSG
                      calculatedAt: '2025-01-20T10:30:00'
                      score: 92
                      riskLevel: LOW
                      actionPriority:
                        value: 42
                        riskLevel: Mid
                    size: 20
                    number: 0
                    totalElements: 150
                    totalPages: 8
                    numberOfElements: 20
                Score results - With Components:
                  summary: Score results with detailed components enabled
                  description: Score results when `includeComponents` is enabled in the configuration. Includes action priority when available, plus groups, components, and subComponents.
                  value:
                    content:
                    - targetId: 102006215
                      targetName: Inter Cars SA
                      edgeNumbers:
                      - number: SUP-12345
                        source: SAP
                        existingEdgeId: 102006215
                      perspectiveId: 1
                      perspectiveName: LKSG
                      calculatedAt: '2025-01-20T10:30:00'
                      score: 85
                      riskLevel: LOW
                      actionPriority:
                        value: 68
                        riskLevel: High
                      groups:
                      - id: 1
                        name: Environmental
                        score: 90
                        riskLevel: LOW
                      - id: 2
                        name: Social
                        score: 80
                        riskLevel: MEDIUM
                      components:
                      - name: Carbon Footprint
                        score: 88
                        riskLevel: LOW
                      - name: Water Usage
                        score: 92
                        riskLevel: LOW
                      subComponents:
                      - name: Scope 1 Emissions
                        score: 92
                        riskLevel: LOW
                      - name: Scope 2 Emissions
                        score: 85
                        riskLevel: MEDIUM
                    size: 20
                    number: 0
                    totalElements: 150
                    totalPages: 8
                    numberOfElements: 20
                Score results - Empty:
                  summary: Empty results when no scores available
                  description: When no export job has been configured or no results are available yet, an empty page is returned.
                  value:
                    content: []
                    size: 20
                    number: 0
                    totalElements: 0
                    totalPages: 0
                    numberOfElements: 0
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 100,\n        \"requestCount\": 100,\n        \"limits\": [\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 500,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
  /public/v1/enterprise-export/scores/errors:
    get:
      tags:
      - Scores - Enterprise Export
      summary: Retrieve Score Generation Errors
      description: Retrieve a paginated list of error logs related to score generation for the authenticated user.
      operationId: getScoreGenerationErrors
      parameters:
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          minimum: 0
          type: integer
          default: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          minimum: 1
          type: integer
          default: 20
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Error logs successfully retrieved. Returns a paginated response containing error entries from the most recent successful execution.
          content:
            application/json:
              schema:
                type: object
                description: Paginated response containing error log entries
              examples:
                Error logs - Multiple errors:
                  summary: Sample paginated error logs response
                  description: Error logs showing multiple targets with different error types. Each entry represents a target-perspective combination that failed during score calculation.
                  value:
                    content:
                    - targetId: 102006215
                      perspectiveId: 1
                      calculatedAt: '2025-01-20T10:30:00'
                      errors:
                      - Insufficient data for score calculation
                      - Missing ESG indicators for target
                    - targetId: 101641243
                      perspectiveId: 2
                      calculatedAt: '2025-01-20T10:30:00'
                      errors:
                      - Target not found in perspective scope
                    - targetId: 10422185
                      perspectiveId: 1
                      calculatedAt: '2025-01-20T10:30:00'
                      errors:
                      - Target data is incomplete
                      - Required data fields are missing
                    size: 20
                    number: 0
                    totalElements: 5
                    totalPages: 1
                    numberOfElements: 3
                Error logs - Single error:
                  summary: Response with single error entry
                  description: A single target-perspective combination that failed with one error message.
                  value:
                    content:
                    - targetId: 102006215
                      perspectiveId: 1
                      calculatedAt: '2025-01-20T10:30:00'
                      errors:
                      - Insufficient data for score calculation
                    size: 20
                    number: 0
                    totalElements: 1
                    totalPages: 1
                    numberOfElements: 1
                Error logs - Empty:
                  summary: No errors occurred
                  description: When no errors occurred during the last execution, an empty page is returned.
                  value:
                    content: []
                    size: 20
                    number: 0
                    totalElements: 0
                    totalPages: 0
                    numberOfElements: 0
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 100,\n        \"requestCount\": 100,\n        \"limits\": [\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 500,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
components:
  schemas:
    ApiRateLimitResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
          example: RateLimitExceeded
        message:
          type: string
          description: Human-readable error message explaining the rate limit violation
          example: API rate limit exceeded. Please reduce your request rate.
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in the current time window
          format: int32
          example: 100
        requestCount:
          type: integer
          description: Number of requests made in the current time window
          format: int32
          example: 101
        limits:
          type: array
          description: All rate limits that apply to this endpoint, showing different time windows
          items:
            $ref: '#/components/schemas/ApiRateLimitTimeRequestLimit'
          example: null
        currentTime:
          type: string
          description: Current server time in ISO 8601 format
          format: date-time
          example: '2026-01-19T10:30:00'
        nextResetAt:
          type: string
          description: Time when the rate limit will reset in ISO 8601 format
          format: date-time
          example: '2026-01-19T10:30:10'
      description: Response returned when API rate limit is exceeded (HTTP 429)
      example: null
    ApiRateLimitTimeRequestLimit:
      type: object
      properties:
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in this time window
          format: int32
          example: 100
        timeInSeconds:
          type: integer
          description: Time window duration in seconds
          format: int32
          example: 10
      description: Rate limit configuration for a specific time window
      example: null
    PublicScoreExecutionConfig:
      required:
      - collectionIds
      - enabled
      - includeComponents
      - perspectiveIds
      - runInterval
      - targetIds
      type: object
      properties:
        runInterval:
          type: string
          description: "\n            Defines the time interval for running the export job.\n            Options include SIX_HOURS, TWELVE_HOURS, DAILY, and WEEKLY.\n            Defaults to WEEKLY if not specified."
          example: WEEKLY
          enum:
          - SIX_HOURS
          - TWELVE_HOURS
          - DAILY
          - WEEKLY
        enabled:
          type: boolean
          description: Indicates whether the export job is enabled. If false, the job will not run.
          example: true
        collectionIds:
          type: array
          description: List of Prewave Collection IDs to include in the export job.
          example:
          - 123
          - 456
          - 789
          items:
            type: integer
            description: List of Prewave Collection IDs to include in the export job.
            format: int32
            example: null
        targetIds:
          type: array
          description: List of Target IDs to include in the export job.
          example:
          - 101
          - 202
          - 303
          - 102006215
          items:
            type: integer
            description: List of Target IDs to include in the export job.
            format: int32
            example: null
        perspectiveIds:
          type: array
          description: List of Perspective IDs to include in the export job.
          example:
          - 1
          - 2
          - 3
          items:
            type: integer
            description: List of Perspective IDs to include in the export job.
            format: int32
            example: null
        includeComponents:
          type: boolean
          description: "\n            Indicates whether to include score components and subcomponents in the export result.\n            If true, components will be included."
          example: false
      example: null
    AccessDeniedErrorDTO:
      required:
      - code
      - loggedIn
      - message
      type: object
      properties:
        loggedIn:
          type: boolean
          example: null
        permission:
          type:
          - string
          - 'null'
          example: null
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type:
          - string
          - 'null'
          description: Possible solution to the error
          example: null
      example: null
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
