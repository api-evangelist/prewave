      description: 'List all site upsert requests for your organisation. The organisation is determined by your API user or API token.


        **Required permission:** `create_sites_upsert_requests`


        **Performance impact:** Low'
      operationId: listRequests_1
      responses:
        '200':
          description: Successfully retrieved site upsert requests
          content:
            application/json:
              schema:
                type: array
