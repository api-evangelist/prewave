components:
  schemas:
    SitesUpsertRequestStatusResponse:
      required:
      - sites
      - status
      type: object
      properties:
        status:
          type: string
          enum:
          - Work in progress
          - Done
          - Failed
          - Cancelled
          example: null
        reason:
          type:
          - string
          - 'null'
          example: null
        sites:
          type: array
          items:
            $ref: '#/components/schemas/SitesUpsertSiteStatusEntry'
          example: null
      example: null
    SitesUpsertValidationFailedResponse:
      required:
      - validationErrors
      type: object
      properties:
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/SitesUpsertValidationErrorEntry'
          example: null
      example: null
    ApiRateLimitTimeRequestLimit:
      type: object
      properties:
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in this time window
          format: int32
          example: 100
        timeInSeconds:
          type: integer
          description: Time window duration in seconds
          format: int32
          example: 10
      description: Rate limit configuration for a specific time window
      example: null
    SitesUpsertSiteStatusEntry:
      required:
      - id
      - status
      - yourReference
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: null
        yourReference:
          type: string
          example: null
        yourReferenceSource:
          type:
          - string
          - 'null'
          example: null
        status:
          type: string
          enum:
          - Work in progress
          - Done
          - Failed
          - Cancelled
          example: null
        statusText:
          type:
          - string
          - 'null'
          example: null
        prewaveId:
          type:
          - integer
          - 'null'
          description: If status is "Done" this will reference the site on Prewave
          format: int32
          example: null
      example: null
    PublicSitesUpsertRequestEntry:
      required:
      - created
      - requestId
      - status
      type: object
      properties:
        requestId:
          type: string
          description: The ID of a sites upsert request. Use this ID to check the status of the request and to retrieve dry-run ids.
          format: uuid
          example: null
        status:
          type: string
          description: Status of the sites upsert request
          enum:
          - Work in progress
          - Done
          - Failed
          - Cancelled
          example: null
        created:
          type: string
          description: The time when the request was created
          format: date-time
          example: null
      example: null
    SitesUpsertExternalReferencePayload:
      required:
      - externalId
      - system
      type: object
      properties:
        externalId:
          type: string
          description: The external identifier
          example: DUNS_123
        system:
          type: string
          description: The external identifier type
          example: duns
      description: External identifiers that uniquely identify a Site. Prewave allows multiple identifier types.
      example: null
    PublicSitesUpsertMatchedTarget:
      required:
      - createdAt
      - edgeNumbers
      - name
      - targetId
      type: object
      properties:
        targetId:
          type: integer
          format: int32
          example: null
        name:
          type: string
          example: null
        createdAt:
          type: string
          format: date-time
          example: null
        edgeNumbers:
          type: array
          items:
            $ref: '#/components/schemas/EdgeNumber'
          example: null
      example: null
    SitesUpsertValidationErrorEntry:
      required:
      - error
      - yourReference
      type: object
      properties:
        yourReference:
          type: string
          example: null
        error:
          type: string
          example: null
      example: null
    ApiRateLimitResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
          example: RateLimitExceeded
        message:
          type: string
          description: Human-readable error message explaining the rate limit violation
          example: API rate limit exceeded. Please reduce your request rate.
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in the current time window
          format: int32
          example: 100
        requestCount:
          type: integer
          description: Number of requests made in the current time window
          format: int32
          example: 101
        limits:
          type: array
          description: All rate limits that apply to this endpoint, showing different time windows
          items:
            $ref: '#/components/schemas/ApiRateLimitTimeRequestLimit'
          example: null
        currentTime:
          type: string
          description: Current server time in ISO 8601 format
          format: date-time
          example: '2026-01-19T10:30:00'
        nextResetAt:
          type: string
          description: Time when the rate limit will reset in ISO 8601 format
          format: date-time
          example: '2026-01-19T10:30:10'
      description: Response returned when API rate limit is exceeded (HTTP 429)
      example: null
    SitesUpsertSafetyStockPayload:
      type: object
      properties:
        onPremiseStockLevelMonths:
          type:
          - integer
          - 'null'
          description: Safety stocks on premise of goods purchased from this supplier
          format: int32
          example: 2
        atSupplierLocation:
          type:
          - string
          - 'null'
          description: The supplier location
          example: SameBuilding
          enum:
          - SameBuilding
          - DifferentFireSection
          - DifferentBuilding
          - NotApplicable
        atSupplierDeviation:
          type:
          - string
          - 'null'
          description: Deviation from the agreed upon Safety Stock
          example: OnTarget
          enum:
          - NotApplicable
          - OnTarget
          - Below
          - Above
        atSupplierStockLevelMonths:
          type:
          - integer
          - 'null'
          description: Agreed upon safety stock at the supplier
          format: int32
          example: 4
        atSupplierLastConfirmedDate:
          type:
          - string
          - 'null'
          description: Date on which the safety stock level was last confirmed by the supplier.
          format: date
          example: '2023-11-23'
        inLogisticChainDaysOnHand:
          type:
          - integer
          - 'null'
          description: Stock Level currently on the logistics chain to the production facilities.
          format: int32
          example: 40
      example: null
    SitesUpsertRequestCreatedResponse:
      required:
      - requestId
      type: object
      properties:
        requestId:
          type: string
          description: The ID of a sites upsert request. Use this ID to check the status of the request and to retrieve dry-run ids.
          format: uuid
          example: null
      example: null
    AccessDeniedErrorDTO:
      required:
      - code
      - loggedIn
      - message
      type: object
      properties:
        loggedIn:
          type: boolean
          example: null
        permission:
          type:
          - string
          - 'null'
          example: null
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type:
          - string
          - 'null'
          description: Possible solution to the error
          example: null
      example: null
    EdgeNumber:
      required:
      - number
      type: object
      properties:
        number:
          type: string
          example: null
        source:
          type:
          - string
          - 'null'
          example: null
        existingEdgeId:
          type:
          - integer
          - 'null'
          format: int32
          example: null
      example: null
    SitesUpsertYourReference:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: A textual identifier that uniquely identifies a Site connected to your organization. Your reference can be a Supplier ID, ERP ID, or any other unique identifier for a site.
          example: ERP-ID-123
        source:
          type:
          - string
          - 'null'
          description: An identifier that determines which system the “your_reference” originates. The source could be any ERP system or any internal tool you use to maintain your data
          example: erp
      example: null
    PublicFullSitesUpsertPayload:
      required:
      - dryRun
      - siteData
      type: object
      properties:
        siteData:
          type: array
          items:
            $ref: '#/components/schemas/SitesUpsertPayloadSiteEntry'
          example: null
        dryRun:
          type: boolean
          description: "If set to true, the request will be processed without actually writing to the database.This is useful for testing purposes.\n            |Use endpoints `{requestId}/dry-runs` and `dry-run/{id}` to get the status and the results of your dry-runs."
          example: null
      example: null
    SitesUpsertPayloadSiteEntry:
      required:
      - addressLine
      - countryCode
      - locality
      - name
      - yourReference
      type: object
      properties:
        name:
          type: string
          description: "The human-readable name for the Site, usually canonical.\n            |The name must refer to an organization that is publicly registered\n            |and carries out its main activity in that specific location."
          example: null
        countryCode:
          type: string
          description: Alpha-2 ISO Code of the address. See https://www.iso.org/obp/ui for details.
          example: AT
        locality:
          type: string
          description: "Refers to the city/town portion of the address.\n            |In regions of the world where localities are not well defined or do not fit into this structure well, choose the closest locally instead.\n            |Must have more than 3 characters."
          example: null
        addressLine:
          type: string
          description: Unstructured address lines describing the lower levels of an address. Usually this is a street name and house number.
          example: Rothschildplatz 4, 3rd Floor
        postalCode:
          type:
          - string
          - 'null'
          description: Postal code of the address. Not all countries use or require postal codes to be present, but where they are used, they may trigger additional validation with other parts of the address.
          example: '1020'
        industries:
          type:
          - array
          - 'null'
          description: Can be used to define industries for a site. This helps to assign the site to a specific industry.
          items:
            $ref: '#/components/schemas/SitesUpsertIndustryDefinitionPayload'
          example: null
        website:
          type:
          - string
          - 'null'
          description: The official website for this site, such as the homepage of a business.
          example: https://www.prewave.com
        contact:
          type:
          - array
          - 'null'
          description: List of email addresses for the site's contacts to complete self-assessments.
          items:
            type: string
            description: List of email addresses for the site's contacts to complete self-assessments.
            example: null
          example: null
        yourReference:
          $ref: '#/components/schemas/SitesUpsertYourReference'
        additionalReferences:
          type: array
          description: A list of additional references that identify a Site connected to your organization. Your reference can be a Supplier ID, ERP ID, or any other unique identifier for a site.
          items:
            $ref: '#/components/schemas/SitesUpsertYourReference'
          default: []
          example: null
        connectionType:
          type: string
          description: "How the Site is associated with your organization.\n            |For reports and analysis, the connection type functions as a filter within the Prewave platform."
          example: Supplier
          default: Supplier
          enum:
          - Supplier
          - Customer
          - Own
        diImpact:
          type:
          - string
          - 'null'
          description: "Your estimated \"Degree of Influence Forced Impact\" on the operation of the site.\n            |Assess your site's risk and prioritize it by determining the level of impact."
          example: Low
          enum:
          - NA
          - 'No'
          - Low
          - Mid
          - High
          - Critical
        biImpact:
          type:
          - string
          - 'null'
          description: "Your estimated \"Business Interruption Forced Impact\" on the operation of the site.\n            |Assess your site's risk and prioritize it by determining the level of impact."
          example: Low
          enum:
          - NA
          - 'No'
          - Low
          - Mid
          - High
          - Critical
        priority:
          type:
          - string
          - 'null'
          description: Priority of the alerts for that Site.
          example: Mid
          enum:
          - Low
          - Mid
          - High
          - Critical
        spendData:
          type:
          - number
          - 'null'
          description: "The total value of the goods and/or services you purchased at that site in EUR per year.\n            |Prewave can automatically evaluate its impact based on the spending data you provide and the total revenue of the site."
          format: double
          example: 500000.0
        collectionNames:
          type:
          - array
          - 'null'
          description: A list of collections in which you want to group your site.
          example:
          - product group
          - responsible supplier manager
          - responsible team
          - region
          - product
          items:
            type: string
            description: A list of collections in which you want to group your site.
            example: '["product group","responsible supplier manager","responsible team","region","product"]'
        externalReferences:
          type:
          - array
          - 'null'
          description: External identifiers that uniquely identify a Site. Prewave allows multiple identifier types.
          items:
            $ref: '#/components/schemas/SitesUpsertExternalReferencePayload'
          example: null
        postInitScreeningPeriod:
          type:
          - integer
          - 'null'
          description: "Request a history screening of the site (in years to be screened) to be triggered automatically right after the onboarding.\n             |Additional costs may apply, quota is affected."
          format: int32
          example: null
        impactData:
          allOf:
          - $ref: '#/components/schemas/SitesUpsertImpactDataPayload'
          example: null
        safetyStock:
          allOf:
          - $ref: '#/components/schemas/SitesUpsertSafetyStockPayload'
          example: null
      example: null
    SitesUpsertDryRunDTO:
      required:
      - dryRunId
      - requestId
      - time
      type: object
      properties:
        requestId:
          type: string
          description: The ID of a sites upsert request. Use this ID to check the status of the request and to retrieve dry-run ids.
          format: uuid
          example: null
        dryRunId:
          type: string
          description: The ID of the dry run. This ID can be used to retrieve the dry run results.
          format: uuid
          example: null
        time:
          type: string
          description: The time when the dry run was created.
          format: date-time
          example: null
      example: null
    SitesUpsertIndustryDefinitionPayload:
      required:
      - industry
      - industryStandard
      type: object
      properties:
        industry:
          type: string
          description: The industry identifier based on the standard
          example: I_AUTOMOTIVE
        industryStandard:
          type: string
          description: The industry standard used
          example: MOCK-ISO-42
      description: Can be used to define industries for a site. This helps to assign the site to a specific industry.
      example: null
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type:
          - string
          - 'null'
          description: Possible solution to the error
          example: null
      description: Error response
      example: null
    PublicDeltaSitesUpsertPayload:
      required:
      - dryRun
      - siteData
      type: object
      properties:
        siteData:
          type: array
          items:
            $ref: '#/components/schemas/SitesUpsertPayloadSiteEntry'
          example: null
        dryRun:
          type: boolean
          description: "If set to true, the request will be processed without actually writing to the database.This is useful for testing purposes.\n            |Use endpoints `{requestId}/dry-runs` and `dry-run/{id}` to get the status and the results of your dry-runs."
          example: null
      example: null
    SitesUpsertImpactDataPayload:
      required:
      - year
      type: object
      properties:
        year:
          type: integer
          description: Year of this impact data
          format: int32
          example: 2024
        bi12MlnEuro:
          type:
          - number
          - 'null'
          description: The Business Interruption-12 Value is the revenue generated with the products produced with the suppliers goods. It represents the revenue at risk in case this supplier fails to deliver.
          format: double
          example: 20.0
        grossMttrEMonths:
          type:
          - integer
          - 'null'
          description: "Mean time to recovery (mttr) in months in case of an \"elementary loss\" of this suppliers facility.\n            |In other words: \"How long does it take to shift production to another site or another supplier?\" "
          format: int32
          example: 2
        grossMttrIMonths:
          type:
          - integer
          - 'null'
          description: "Mean time to recovery (mttr) in months in case of an \"insolvency loss\" of this suppliers facility.\n            |In other words: \"'\"How long does it take to shift production to another site or another supplier?\" "
          format: int32
          example: 4
        cocSigned:
          type:
          - boolean
          - 'null'
          description: Did this supplier sign our Code of Conduct?
          example: true
        additionalInformation:
          type:
          - string
          - 'null'
          description: Additional text information regarding this impact data
          example: null
      description: Data related to calculating the impact.
      example: null
  securitySchemes:
    Token_authentication:
      type: apiKey
      description: Generate an API token at https://www.prewave.com/management/api and paste it in here.
      name: X-Auth-Token
      in: header
