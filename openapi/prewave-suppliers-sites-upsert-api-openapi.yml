components:
  schemas:
    SitesUpsertSafetyStockPayload:
      type: object
      properties:
        onPremiseStockLevelMonths:
          type: integer
          description: Safety stocks on premise of goods purchased from this supplier
          format: int32
          nullable: true
          example: 2
        atSupplierLocation:
          type: string
          description: The supplier location
          nullable: true
          example: SameBuilding
          enum:
          - SameBuilding
          - DifferentFireSection
          - DifferentBuilding
          - NotApplicable
        atSupplierDeviation:
          type: string
          description: Deviation from the agreed upon Safety Stock
          nullable: true
          example: OnTarget
          enum:
          - NotApplicable
          - OnTarget
          - Below
          - Above
        atSupplierStockLevelMonths:
          type: integer
          description: Agreed upon safety stock at the supplier
          format: int32
          nullable: true
          example: 4
        atSupplierLastConfirmedDate:
          type: string
          description: Date on which the safety stock level was last confirmed by the supplier.
          format: date
          nullable: true
          example: '2023-11-23'
        inLogisticChainDaysOnHand:
          type: integer
          description: Stock Level currently on the logistics chain to the production facilities.
          format: int32
          nullable: true
          example: 40
      example: null
    SitesUpsertDryRunDTO:
      required:
      - dryRunId
      - requestId
      - time
      type: object
      properties:
        requestId:
          type: string
          description: The ID of a sites upsert request. Use this ID to check the status of the request and to retrieve dry-run ids.
          format: uuid
          example: null
        dryRunId:
          type: string
          description: The ID of the dry run. This ID can be used to retrieve the dry run results.
          format: uuid
          example: null
        time:
          type: string
          description: The time when the dry run was created.
          format: date-time
          example: null
      example: null
    SitesUpsertValidationFailedResponse:
      required:
      - validationErrors
      type: object
      properties:
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/SitesUpsertValidationErrorEntry'
          example: null
      example: null
    ApiRateLimitResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
          example: RateLimitExceeded
        message:
          type: string
          description: Human-readable error message explaining the rate limit violation
          example: API rate limit exceeded. Please reduce your request rate.
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in the current time window
          format: int32
          example: 100
        requestCount:
          type: integer
          description: Number of requests made in the current time window
          format: int32
          example: 101
        limits:
          type: array
          description: All rate limits that apply to this endpoint, showing different time windows
          items:
            $ref: '#/components/schemas/ApiRateLimitTimeRequestLimit'
          example: null
        currentTime:
          type: string
          description: Current server time in ISO 8601 format
          format: date-time
          example: '2026-01-19T10:30:00'
        nextResetAt:
          type: string
          description: Time when the rate limit will reset in ISO 8601 format
          format: date-time
          example: '2026-01-19T10:30:10'
      description: Response returned when API rate limit is exceeded (HTTP 429)
      example: null
    SitesUpsertPayloadSiteEntry:
      required:
      - addressLine
      - countryCode
      - locality
      - name
      - yourReference
      type: object
      properties:
        name:
          type: string
          description: "The human-readable name for the Site, usually canonical.\n            |The name must refer to an organization that is publicly registered\n            |and carries out its main activity in that specific location."
          example: null
        countryCode:
          type: string
          description: Alpha-2 ISO Code of the address. See https://www.iso.org/obp/ui for details.
          example: AT
        locality:
          type: string
          description: "Refers to the city/town portion of the address.\n            |In regions of the world where localities are not well defined or do not fit into this structure well, choose the closest locally instead.\n            |Must have more than 3 characters."
          example: null
        addressLine:
          type: string
          description: Unstructured address lines describing the lower levels of an address. Usually this is a street name and house number.
          example: Rothschildplatz 4, 3rd Floor
        postalCode:
          type: string
          description: Postal code of the address. Not all countries use or require postal codes to be present, but where they are used, they may trigger additional validation with other parts of the address.
          nullable: true
          example: '1020'
        industries:
          type: array
          description: Can be used to define industries for a site. This helps to assign the site to a specific industry.
          nullable: true
          items:
            $ref: '#/components/schemas/SitesUpsertIndustryDefinitionPayload'
          example: null
        website:
          type: string
          description: The official website for this site, such as the homepage of a business.
          nullable: true
          example: https://www.prewave.com
        contact:
          type: array
          description: List of email addresses for the site's contacts to complete self-assessments.
          nullable: true
          items:
            type: string
            description: List of email addresses for the site's contacts to complete self-assessments.
            example: null
          example: null
        yourReference:
          $ref: '#/components/schemas/SitesUpsertYourReference'
        additionalReferences:
          type: array
          description: A list of additional references that identify a Site connected to your organization. Your reference can be a Supplier ID, ERP ID, or any other unique identifier for a site.
          items:
            $ref: '#/components/schemas/SitesUpsertYourReference'
          default: []
          example: null
        connectionType:
          type: string
          description: "How the Site is associated with your organization.\n            |For reports and analysis, the connection type functions as a filter within the Prewave platform."
          example: Supplier
          default: Supplier
          enum:
          - Supplier
          - Customer
          - Own
        diImpact:
          type: string
          description: "Your estimated \"Degree of Influence Forced Impact\" on the operation of the site.\n            |Assess your site's risk and prioritize it by determining the level of impact."
          nullable: true
          example: Low
          enum:
          - NA
          - 'No'
          - Low
          - Mid
          - High
          - Critical
        biImpact:
          type: string
          description: "Your estimated \"Business Interruption Forced Impact\" on the operation of the site.\n            |Assess your site's risk and prioritize it by determining the level of impact."
          nullable: true
          example: Low
          enum:
          - NA
          - 'No'
          - Low
          - Mid
          - High
          - Critical
        priority:
          type: string
          description: Priority of the alerts for that Site.
          nullable: true
          example: Mid
          enum:
          - Low
          - Mid
          - High
          - Critical
        spendData:
          type: number
          description: "The total value of the goods and/or services you purchased at that site in EUR per year.\n            |Prewave can automatically evaluate its impact based on the spending data you provide and the total revenue of the site."
          format: double
          nullable: true
          example: 500000.0
        collectionNames:
          type: array
          description: A list of collections in which you want to group your site.
          nullable: true
          example:
          - product group
          - responsible supplier manager
          - responsible team
          - region
          - product
          items:
            type: string
            description: A list of collections in which you want to group your site.
            example: '["product group","responsible supplier manager","responsible team","region","product"]'
        externalReferences:
          type: array
          description: External identifiers that uniquely identify a Site. Prewave allows multiple identifier types.
          nullable: true
          items:
            $ref: '#/components/schemas/SitesUpsertExternalReferencePayload'
          example: null
        postInitScreeningPeriod:
          type: integer
          description: "Request a history screening of the site (in years to be screened) to be triggered automatically right after the onboarding.\n             |Additional costs may apply, quota is affected."
          format: int32
          nullable: true
          example: null
        impactData:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/SitesUpsertImpactDataPayload'
          example: null
        safetyStock:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/SitesUpsertSafetyStockPayload'
          example: null
      example: null
    AccessDeniedErrorDTO:
      required:
      - code
      - loggedIn
      - message
      type: object
      properties:
        loggedIn:
          type: boolean
          example: null
        permission:
          type: string
          nullable: true
          example: null
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type: string
          description: Possible solution to the error
          nullable: true
          example: null
      example: null
    ErrorDTO:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          description: Error code
          example: null
        message:
          type: string
          description: Error message
          example: null
        solution:
          type: string
          description: Possible solution to the error
          nullable: true
          example: null
      description: Error response
      example: null
    SitesUpsertExternalReferencePayload:
      required:
      - externalId
      - system
      type: object
      properties:
        externalId:
          type: string
          description: The external identifier
          example: DUNS_123
        system:
          type: string
          description: The external identifier type
          example: duns
      description: External identifiers that uniquely identify a Site. Prewave allows multiple identifier types.
      example: null
    SitesUpsertRequestCreatedResponse:
      required:
      - requestId
      type: object
      properties:
        requestId:
          type: string
          description: The ID of a sites upsert request. Use this ID to check the status of the request and to retrieve dry-run ids.
          format: uuid
          example: null
      example: null
    EdgeNumber:
      required:
      - number
      type: object
      properties:
        number:
          type: string
          example: null
        source:
          type: string
          nullable: true
          example: null
        existingEdgeId:
          type: integer
          format: int32
          nullable: true
          example: null
      example: null
    SitesUpsertRequestStatusResponse:
      required:
      - sites
