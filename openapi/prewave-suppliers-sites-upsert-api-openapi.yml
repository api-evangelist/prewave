      example: null
    PublicSitesUpsertRequestEntry:
      required:
      - created
      - requestId
      - status
      type: object
      properties:
        requestId:
          type: string
          description: The ID of a sites upsert request. Use this ID to check the status of the request and to retrieve dry-run ids.
          format: uuid
          example: null
        status:
          type: string
          description: Status of the sites upsert request
          enum:
          - Work in progress
          - Done
          - Failed
          - Cancelled
          example: null
        created:
          type: string
          description: The time when the request was created
          format: date-time
          example: null
      example: null
    PublicSitesUpsertMatchedTarget:
      required:
      - createdAt
      - edgeNumbers
      - name
      - targetId
      type: object
      properties:
        targetId:
          type: integer
          format: int32
          example: null
        name:
          type: string
          example: null
        createdAt:
          type: string
          format: date-time
          example: null
        edgeNumbers:
          type: array
          items:
            $ref: '#/components/schemas/EdgeNumber'
          example: null
      example: null
    SitesUpsertYourReference:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: A textual identifier that uniquely identifies a Site connected to your organization. Your reference can be a Supplier ID, ERP ID, or any other unique identifier for a site.
          example: ERP-ID-123
        source:
          type: string
          description: An identifier that determines which system the “your_reference” originates. The source could be any ERP system or any internal tool you use to maintain your data
          nullable: true
          example: erp
      example: null
    PublicDeltaSitesUpsertPayload:
      required:
      - dryRun
      - siteData
      type: object
      properties:
        siteData:
          type: array
          items:
            $ref: '#/components/schemas/SitesUpsertPayloadSiteEntry'
          example: null
        dryRun:
          type: boolean
          description: "If set to true, the request will be processed without actually writing to the database.This is useful for testing purposes.\n            |Use endpoints `{requestId}/dry-runs` and `dry-run/{id}` to get the status and the results of your dry-runs."
          example: null
      example: null
    SitesUpsertImpactDataPayload:
      required:
      - year
      type: object
      properties:
        year:
          type: integer
          description: Year of this impact data
          format: int32
          example: 2024
        bi12MlnEuro:
          type: number
          description: The Business Interruption-12 Value is the revenue generated with the products produced with the suppliers goods. It represents the revenue at risk in case this supplier fails to deliver.
          format: double
          nullable: true
          example: 20.0
