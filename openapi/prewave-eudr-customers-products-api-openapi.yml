  /public/v2/eudr/customers/products/inbound:
    get:
      tags:
      - EUDR - Customers - Products
      summary: Get a list of inbound products
      description: 'Retrieve a paginated list of inbound products for EUDR compliance.


        Inbound products are products that your organization receives from suppliers.

        Use `includeOrigins=true` (default) to include origin information on each product.


        **Use Cases**:

        - List all inbound products

        - Filter products by various criteria

        - Review supplier, DDS status, and origin data per product


        **Pagination**:

        - Results are paginated (default: 10 items per page)

        - Use `page` and `size` query parameters to control pagination


        **Required permission:** `access_public_products`'
      operationId: findInboundProducts
      parameters:
      - name: ids
        in: query
        description: Filter by product IDs. When set, other filters are ignored.
        required: false
        schema:
          type: array
          description: Filter by product IDs. When set, other filters are ignored.
          example:
          - 1
          - 2
          - 3
          items:
            type: integer
            description: Filter by product IDs. When set, other filters are ignored.
            format: int32
        example:
        - 1
        - 2
        - 3
      - name: q
        in: query
        description: Full text search query for product names, suppliers  or product references.
        required: false
        schema:
          type: string
          description: Full text search query for product names, suppliers  or product references.
          example: soy oil
        example: soy oil
      - name: refs
        in: query
        description: Filter by product references.
        required: false
        schema:
          type: array
          description: Filter by product references.
          example:
          - Ref123
          - Ref456
          items:
            type: string
            description: Filter by product references.
            example: '["Ref123","Ref456"]'
        example:
        - Ref123
        - Ref456
      - name: las
        in: query
        description: Filter by legality assessment status.
        required: false
        schema:
          type: array
          description: Filter by legality assessment status.
          example:
          - Negligible
          - NotRequired
          items:
            type: string
            description: Filter by legality assessment status.
            example: '["Negligible","NotRequired"]'
            enum:
            - Negligible
            - NonNegligible
            - NotRequired
            - Required
        example:
        - Negligible
        - NotRequired
      - name: dfs
        in: query
        description: Filter by DF status.
        required: false
        schema:
          type: array
          description: Filter by DF status.
          example:
          - Negligible
          - NotRequired
          items:
            type: string
            description: Filter by DF status.
            example: '["Negligible","NotRequired"]'
            enum:
            - Negligible
            - NonNegligible
            - NotRequired
            - Required
        example:
        - Negligible
        - NotRequired
      - name: dd
        in: query
        description: Filter by DDS status.
        required: false
        schema:
          type: array
          description: Filter by DDS status.
          example:
          - Blocked
          - Allowed
          - WaitingForOrigins
          - Draft
          items:
            type: string
            description: Filter by DDS status.
            example: '["Blocked","Allowed","WaitingForOrigins","Draft"]'
            enum:
            - Blocked
            - Allowed
            - WaitingForOrigins
            - NotRequired
            - Draft
            - Submitting
            - Submitted
            - Available
            - SubmissionError
        example:
        - Blocked
        - Allowed
        - WaitingForOrigins
        - Draft
      - name: os
        in: query
        description: Filter by origin status.
        required: false
        schema:
          type: string
          description: Filter by origin status.
          example: Active
          enum:
          - Missing
          - Active
        example: Active
      - name: ors
        in: query
        description: Filter by origin request status.
        required: false
        schema:
