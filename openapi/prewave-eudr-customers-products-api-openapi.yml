components:
  schemas:
    PublicFeatureCollection:
      required:
      - features
      type: object
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/PublicFeature'
          example: null
      description: Plot of the origin
      example: null
    ApiRateLimitTimeRequestLimit:
      type: object
      properties:
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in this time window
          format: int32
          example: 100
        timeInSeconds:
          type: integer
          description: Time window duration in seconds
          format: int32
          example: 10
      description: Rate limit configuration for a specific time window
      example: null
    PublicDDSReference:
      required:
      - ddsId
      - reference
      - type
      type: object
      properties:
        ddsId:
          type: integer
          description: Referenced DDS ID
          format: int32
          example: 456
        reference:
          type: string
          description: Reference label
          example: PO-2025-001
        type:
          type: string
          description: Public product reference type.
          example: PurchaseOrder
          enum:
          - PurchaseOrder
          - ShipmentNumber
          - Other
      description: List of DDS references
      example: null
    PublicInboundProduct:
      required:
      - active
      - commodity
      - creatorType
      - customerId
      - hasPendingOriginRequest
      - hsCode
      - id
      - name
      - orgId
      - origins
      - supplier
      - supplierDDS
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: null
        customerId:
          type: integer
          format: int32
          example: null
        orgId:
          type: integer
          format: int32
          example: null
        name:
          type: string
          example: null
        scientificName:
          type:
          - string
          - 'null'
          example: null
        reference:
          type:
          - string
          - 'null'
          example: null
        commodity:
          $ref: '#/components/schemas/PublicCommodity'
        hsCode:
          $ref: '#/components/schemas/PublicProductHSCode'
        annualSpend:
          type:
          - number
          - 'null'
          description: Annual spend
          example: 10000.0
          deprecated: true
        annualQuantity:
          type:
          - number
          - 'null'
          description: Annual quantity
          example: 500.0
          deprecated: true
        unit:
          type:
          - string
          - 'null'
          description: Quantity unit
          example: kg
          deprecated: true
        countryRisk:
          type:
          - string
          - 'null'
          description: Public EUDR risk.
          enum:
          - Low
          - Mid
          - High
          example: null
        origins:
          $ref: '#/components/schemas/PublicOrigin'
        hasPendingOriginRequest:
          type: boolean
          description: Indicates if the product has a pending origin request
          example: false
        pendingDFRequest:
          allOf:
          - $ref: '#/components/schemas/PublicPendingDFRequest'
          example: null
        supplier:
          $ref: '#/components/schemas/PublicSupplier'
        supplierDDS:
          $ref: '#/components/schemas/PublicProductSupplierDDS'
        dfAssessment:
          allOf:
          - $ref: '#/components/schemas/PublicDFAssessment'
          example: null
        ddsStatus:
          allOf:
          - $ref: '#/components/schemas/PublicCustomerDDSStatus'
          example: null
        customerDDS:
          allOf:
          - $ref: '#/components/schemas/PublicProductCustomerDDS'
          example: null
        supplierMaturity:
          allOf:
          - $ref: '#/components/schemas/PublicSupplierMaturity'
          example: null
        legalityAssessment:
          allOf:
          - $ref: '#/components/schemas/PublicLegalityAssessment'
          example: null
        active:
          type: boolean
          description: Product active status
          example: true
        creatorType:
          type: string
          description: Public EUDR user type.
          example: Customer
          enum:
          - Customer
          - Supplier
          - Producer
      example: null
    PublicSupplierMaturity:
      type: object
      properties:
        answerStatus:
          type:
          - string
          - 'null'
          description: Enum representing possible statuses for a supplier's questionnaire answer in the public API.
          enum:
          - Requested
          - InProgress
          - Good
          - Critical
          example: null
        answerHidden:
          type:
          - boolean
          - 'null'
          description: True if the answer is hidden due to permission status (e.g., denied or not requested), otherwise false.
          example: null
      description: Public API payload representing the status of a supplier maturity assessment
      example: null
    PublicLegalityAssessment:
      required:
      - status
      type: object
      properties:
        minScore:
          allOf:
          - $ref: '#/components/schemas/Score'
          example: null
        minScoreAvail:
          type:
          - string
          - 'null'
          description: Public score availability.
          example: Peer
          enum:
          - None
          - Peer
          - Alert
          - SSA
          - External
        status:
          type: string
          description: Public legality assessment status.
          example: Negligible
          enum:
          - Negligible
          - NonNegligible
          - NotRequired
          - Required
      description: Legality assessment result
      example: null
    PublicDFCheckResult:
      required:
      - outdated
      - status
      type: object
      properties:
        status:
          type: string
          description: Public deforestation status.
          enum:
          - Negligible
          - NonNegligible
          - NotRequired
          - Required
          example: null
        outdated:
          type: boolean
          description: Is the check outdated
          example: null
      description: Deforestation check result status
      example: null
    PublicProducer:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          description: Target ID of the producer
          format: int32
          example: null
        name:
          type: string
          description: Producer name
          example: null
        geo:
          allOf:
          - $ref: '#/components/schemas/PublicGeometrySchema'
          example: null
        countryId:
          type:
          - integer
          - 'null'
          description: Country ID of the producer
          format: int32
          example: null
      description: Producer of the origin
      example: null
    Score:
      required:
      - risk
      - value
      type: object
      properties:
        value:
          type: integer
          format: int32
          example: null
        risk:
          type: string
          enum:
          - NA
          - 'No'
          - Low
          - Mid
          - High
          - Critical
          example: null
      example: null
    PublicOutboundProductPayload:
      required:
      - hsCode
      - name
      type: object
      properties:
        name:
          type: string
          description: Product name.
          example: Wooden Table
        scientificName:
          type:
          - string
          - 'null'
          description: Scientific name label.
          example: Quercus robur
        reference:
          type:
          - string
          - 'null'
          description: Reference label.
          example: REF-12345
        hsCode:
          type: string
          description: HS code associated with the product. Can be retrieved from the HS code list endpoint.
          example: '440799'
        annualRevenue:
          type:
          - number
          - 'null'
          description: Annual revenue (EUR).
          format: decimal
          example: 15000.0
          deprecated: true
        annualQuantity:
          type:
          - number
          - 'null'
          description: Annual quantity.
          example: 100.0
          deprecated: true
        unit:
          type:
          - string
          - 'null'
          description: Quantity unit.
          example: kg
          deprecated: true
      description: Payload for creating or updating an outbound product. Inherits common product properties and adds annual revenue.
      example: null
    PublicCustomerDDSStatus:
      required:
      - status
      type: object
      properties:
        status:
          type: string
          description: Public DDS status.
          example: Allowed
          enum:
          - Blocked
          - Allowed
          - WaitingForOrigins
          - NotRequired
          - Draft
          - Submitting
          - Submitted
          - Available
          - SubmissionError
        reason:
          type:
          - string
          - 'null'
          description: Public reason for DDS status.
          example: NoOrigins
          enum:
          - NoOrigins
