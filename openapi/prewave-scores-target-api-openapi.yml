openapi: 3.2.0
info:
  title: Public Prewave Scores - Target API
  description: Documentation of the Public Prewave API.
  version: '1.0'
servers:
- url: https://api.prewave.com
  description: Production Environment
security:
- Token authentication: []
tags:
- name: Scores - Target
  description: '⚠️ **DEPRECATED** - Target score endpoints. These endpoints are deprecated and will be removed at the end of December 2026. Use `/public/v1/enterprise-export/scores` instead.


    **Note**: Responses from these endpoints include a `Sunset` HTTP header (RFC 8594) indicating the removal date.'
paths:
  /public/v1/target/{systemId}/{targetId}/score:
    get:
      tags:
      - Scores - Target
      summary: Returns the target score including the overall score and scores for all…
      description: '⚠️ **DEPRECATED** - This endpoint is deprecated and will be removed at the end of December 2026.


        **Note**: Responses include a `Sunset` HTTP header (RFC 8594) indicating the removal date.


        ---


        ## Migration Required


        This endpoint has been deprecated in favor of the Enterprise Export API. Please migrate to the new endpoint:


        ### Replacement Endpoint


        | Old Endpoint | New Endpoint | Purpose |

        |--------------|--------------|---------|

        | `GET /public/v1/target/{systemId}/{targetId}/score` | `GET /public/v1/enterprise-export/scores` | Retrieve score data |


        ---


        ## Why Migrate?


        The Enterprise Export API (`PublicEnterpriseExportController`) provides significant improvements:


        ### 1. Bulk Operations

        - Retrieve scores for multiple targets in a single request

        - More efficient for large-scale integrations


        ### 2. Automated Updates

        - Configure scheduled exports that run automatically

        - No need to poll individual endpoints


        ### 3. Better Performance

        - Optimized for large-scale data retrieval

        - Consistent data calculation timestamps


        ### 4. Error Handling

        - Detailed error logs for failed calculations

        - Better visibility into data quality issues


        ---


        ## Quick Migration Guide


        ### Step 1: Configure Export Job


        Use `POST /public/v1/enterprise-export/scores/config` to set up your export configuration:


        ```json

        {

        "runInterval": "DAILY",

        "enabled": true,

        "collectionIds": [123, 456],

        "targetIds": [102006215, 101641243],

        "perspectiveIds": [1, 2],

        "includeComponents": true

        }

        ```


        ### Step 2: Retrieve Scores


        Use `GET /public/v1/enterprise-export/scores` to retrieve score data:


        ```http

        GET /public/v1/enterprise-export/scores?page=0&size=20

        ```


        The response includes all the same information as this endpoint, plus additional metadata:

        - Calculation timestamps

        - Risk levels

        - Edge numbers for target identification


        ---


        ## Current Endpoint Behavior


        **Required Permission**: `ACCESS_PUBLIC_TARGET_SCORE`


        **Performance impact**: Low


        Returns the target score including:

        - Overall target score

        - Scores for all infotag groups


        Supports filtering by:

        - Perspective ID (optional, defaults to user''s perspective)

        - Group ID (optional)

        - Component (optional)

        - Subcomponent (optional)'
      operationId: score
      parameters:
      - name: systemId
        in: path
        description: The system ID is an identifier to determine from which the targetId might originate from. Supported systemIds are "prewave", "customer", "supplier", "own".
        required: true
        schema:
          type: string
      - name: targetId
        in: path
        description: The target ID can be the target's prewaveId or an external id (edge number) representing the site in another system.
        required: true
        schema:
          type: string
      - name: perspectiveId
        in: query
        description: Id of the perspective, that should be used to calculate the target-score.
        required: false
        schema:
          type: integer
          format: int32
      - name: groupId
        in: query
        description: Id of the group that items should be returned
        required: false
        schema:
          type: integer
          format: int32
      - name: component
        in: query
        description: Filter by score component
        required: false
        schema:
          type: string
          enum:
          - PeerScore
          - AlertScore
          - SSAScore
          - ExternalScore
          - TierNScore
      - name: subcomponent
        in: query
        description: Filter by score subcomponent
        required: false
        schema:
          type: string
          enum:
          - CountryScore
          - IndustryScore
          - CommodityScore
          - PublicAlertScore
          - CustomerAlertScore
          - InternalScore
          - TierNIndustryScore
          - TierNCommodityScore
          - TargetScore
      responses:
        '200':
          description: Target score successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTargetScore'
              examples:
                Score response example:
                  summary: Sample target score response
                  description: Score response example
                  value:
                    score:
                      score: 85
                      riskLevel: LOW
                    groups:
                    - id: 1
                      name: Environmental
                      score: 90
                    - id: 2
                      name: Social
                      score: 80
        '404':
          description: Target not found or no permission to access it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
        '403':
          description: '403 Forbidden - Authentication or authorization failure. This status code is returned when: (1) the request lacks valid authentication credentials (missing or invalid X-Auth-Token header), or (2) the authenticated user does not have the required permission to access this resource.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedErrorDTO'
              examples:
                Access denied example:
                  summary: User lacks necessary permissions or authentication
                  value: "{\n        \"loggedIn\": true,\n        \"code\": \"access_denied\",\n        \"message\": \"Access denied: you don't have necessary permissions to access this resource\",\n        \"solution\": \"Contact support for appropriate permissions\"\n    }"
        '500':
          description: 500 Internal Server Error - An unexpected error occurred on the server. The request may or may not have been processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
              examples:
                Error - Server Error:
                  summary: Unexpected server error
                  value: "{\n        \"code\": \"internal_error\",\n        \"message\": \"An unexpected error occurred\",\n        \"solution\": \"Please try again later or contact support\"\n    }"
        '429':
          description: '429 Too Many Requests - API rate limit exceeded. The request has been rejected because the rate limit for this endpoint has been exceeded. Default rate limits: GET requests - 100 per 10 seconds, 500 per minute; POST/PUT/PATCH/DELETE requests - 20 per 10 seconds, 100 per minute. For increased access, please contact customer success.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRateLimitResponse'
              examples:
                Rate limit exceeded example:
                  summary: API rate limit exceeded
                  value: "{\n        \"error\": \"API rate limit exceeded\",\n        \"message\": \"You have reached the maximum allowed requests. Please try again later or upgrade your plan for increased access\",\n        \"requestLimit\": 100,\n        \"requestCount\": 100,\n        \"limits\": [\n            {\n                \"requestLimit\": 100,\n                \"timeInSeconds\": 10\n            },\n            {\n                \"requestLimit\": 500,\n                \"timeInSeconds\": 60\n            }\n        ],\n        \"currentTime\": \"2026-01-15T10:30:00\",\n        \"nextResetAt\": \"2026-01-15T10:30:10\"\n    }"
      deprecated: true
