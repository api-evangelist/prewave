components:
  schemas:
    PublicGroupScore:
      required:
      - group
      type: object
      properties:
        group:
          $ref: '#/components/schemas/PublicInfotagGroup'
        score:
          allOf:
          - $ref: '#/components/schemas/PublicScore'
          example: null
      description: List of group scores
      example: null
    PublicTargetScore:
      required:
      - groups
      - score
      type: object
      properties:
        score:
          $ref: '#/components/schemas/PublicScore'
        groups:
          type: array
          description: List of group scores
          items:
            $ref: '#/components/schemas/PublicGroupScore'
          example: null
      example: null
    ApiRateLimitResponse:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
          example: RateLimitExceeded
        message:
          type: string
          description: Human-readable error message explaining the rate limit violation
          example: API rate limit exceeded. Please reduce your request rate.
        requestLimit:
          type: integer
          description: Maximum number of requests allowed in the current time window
