arazzo: 1.0.1
info:
  title: Onboard and monitor a supplier
  version: 1.0.0
  summary: Create a supplier site, run validation and screening, then read its risk alerts.
  x-realizes-capability-ids:
  - BC-510.10
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-510.10
      capability_name: Supplier Onboarding Management
      spec: prewave-suppliers-sites-api-openapi.yml
      confidence: 0.75
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: alertsApi
  url: ../openapi/prewave-alerts-api-openapi.yml
  type: openapi
- name: suppliersSitesApi
  url: ../openapi/prewave-suppliers-sites-api-openapi.yml
  type: openapi
workflows:
- workflowId: onboardAndMonitorSupplier
  summary: Create a supplier site, validate and screen it, then pull its alerts.
  inputs:
    type: object
    properties:
      supplier:
        type: object
      systemId:
        type: string
      targetId:
        type: string
  steps:
  - stepId: createSupplier
    operationId: createSupplier
    requestBody:
      payload: $inputs.supplier
    successCriteria:
    - condition: $statusCode == 201
  - stepId: requestValidation
    operationId: requestValidation
    successCriteria:
    - condition: $statusCode == 202
  - stepId: getValidationStatus
    operationId: getValidationStatus
    successCriteria:
    - condition: $statusCode == 200
  - stepId: requestScreening
    operationId: requestScreening
    successCriteria:
    - condition: $statusCode == 202
  - stepId: getScreeningStatus
    operationId: getScreeningStatus
    successCriteria:
    - condition: $statusCode == 200
  - stepId: targetAlerts
    operationId: targetAlerts
    parameters:
    - name: systemId
      in: path
      value: $inputs.systemId
    - name: targetId
      in: path
      value: $inputs.targetId
    successCriteria:
    - condition: $statusCode == 200
